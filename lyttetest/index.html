<style>
@font-face { font-family: "Cine"; src: url(https://blindtest.franklymydear.dk/fonts/GTCinetype-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Cine"; src: url(https://blindtest.franklymydear.dk/fonts/GTCinetype-Bold.woff2) format("woff2"); font-weight: 600 800; font-display: swap; }
:root { --bg: #111214; --flade: #1a1c20; --flade2: #22252b; --kant: #2c3037; --tekst: #ecebe7; --svag: #9b988f;
  --accent: #c9a46a; --spot: #6fbf73; --ok: #a7c76a; --delvist: #d9b45a; --nej: #d0685f; --aims: #d39a5f; --vores: #6fa8dc; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tekst); font: 16px/1.45 "Cine", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--kant); padding: 12px 16px 10px; }
header .linje { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 760px; margin: 0 auto; }
header h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 10px; }
header h1 img { height: 22px; width: auto; display: block; }
header .trin { color: var(--svag); font-size: 13px; background: none; border: 0; padding: 0; text-align: right; }
header .trin.knap-aktiv { color: var(--tekst); text-decoration: underline; text-underline-offset: 3px; }
#oversigt { max-width: 760px; margin: 10px auto 0; max-height: 70vh; overflow-y: auto; }
#oversigt .rk { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  background: var(--flade); border: 1px solid var(--kant); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
#oversigt .rk.nu { border-color: var(--accent); }
#oversigt .rk:disabled { opacity: .4; cursor: default; }
#oversigt .rk .n { color: var(--svag); font-variant-numeric: tabular-nums; }
#oversigt .rk .ty { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
#oversigt .rk .tx { display: block; color: var(--tekst); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#oversigt .rk .st { font-size: 13px; color: var(--svag); }
#oversigt .rk .st.ok { color: var(--spot); }
.fremdrift { max-width: 760px; margin: 8px auto 0; height: 3px; background: var(--kant); border-radius: 2px; overflow: hidden; }
.fremdrift div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
/* Opgaven står altid fast øverst, mens man ruller i numrene (Steffen 30/10) */
.opgave { position: sticky; top: var(--hoved, 58px); z-index: 4; background: var(--bg); padding-top: 2px; }
.opgave .kort { margin-bottom: 10px; box-shadow: 0 8px 16px -10px #000; }
.opgave .sporg { margin: 10px 0 0; }
.scene-lille { color: var(--svag); font-size: 14px; margin-bottom: 4px; }
.kursiv, .brief { font-style: italic; }  /* kundens tekst, briefen og testerens egen søgning (Steffen 2/11) */
.brief { font-size: 16px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.brief.aaben { display: block; }
.faelles { color: var(--svag); font-size: 12px; }
.lille { border: 0; background: none; color: var(--accent); padding: 0; font-size: 14px; text-decoration: underline; }
.kort { background: var(--flade); border: 1px solid var(--kant); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.type { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* opgavenummer og ‹ › øverst til højre i opgaveblokken (Steffen 2/11) */
.type .nav { display: flex; align-items: center; gap: 6px; color: var(--svag); letter-spacing: 0; text-transform: none; font-size: 13px; font-variant-numeric: tabular-nums; }
.type .nav button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--kant); background: var(--flade2); font-size: 16px; line-height: 1; padding: 0; }
.type .nav button:disabled { opacity: .3; cursor: default; }
.soegetekst { font-size: 21px; font-weight: 650; line-height: 1.3; }
.sporg { font-size: 19px; font-weight: 700; margin: 14px 0 10px; }
.hjaelp { color: var(--svag); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
.knap { border: 1px solid var(--kant); background: var(--flade2); border-radius: 10px; padding: 10px 16px; }
.knap.primaer { background: var(--accent); border-color: var(--accent); color: #1b1407; font-weight: 650; }
.knap:disabled { opacity: .45; cursor: default; }
.raekke { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], textarea { width: 100%; font: inherit; font-size: 16px; color: var(--tekst); background: var(--flade2); border: 1px solid var(--kant); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 64px; }
.nummer { display: grid; grid-template-columns: 44px 1fr; gap: 6px 12px; padding: 12px; border: 1px solid var(--kant); border-radius: 12px; margin-bottom: 10px; background: var(--flade); }
.nummer.spiller { border-color: var(--accent); }
.nummer.bedoemt { opacity: .78; }
.spil { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--kant); background: var(--flade2); display: grid; place-items: center; }
.spil svg { width: 16px; height: 16px; fill: var(--tekst); }
.titel { font-weight: 600; }
.kunstner { color: var(--svag); font-size: 14px; }
canvas.boelge { grid-column: 1 / -1; width: 100%; height: 40px; cursor: pointer; }
.karakterer { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.karakterer button { border: 1px solid var(--kant); background: var(--flade2); border-radius: 8px; padding: 8px 4px; font-size: 14px; }
.karakterer button.valgt[data-k=praecis] { background: var(--spot); color: #0d1a0e; border-color: var(--spot); }
.karakterer button.valgt[data-k=godt] { background: var(--ok); color: #151a08; border-color: var(--ok); }
.karakterer button.valgt[data-k=delvist] { background: var(--delvist); color: #1d1606; border-color: var(--delvist); }
.karakterer button.valgt[data-k=nej] { background: var(--nej); color: #1e0b09; border-color: var(--nej); }
.ab { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.klip { border: 1px solid var(--kant); border-radius: 12px; padding: 16px; text-align: center; background: var(--flade); }
.klip.spiller { border-color: var(--accent); }
.klip .bogstav { font-size: 34px; font-weight: 750; margin-bottom: 8px; }
.klip .bar { height: 4px; background: var(--kant); border-radius: 2px; margin: 12px 0; overflow: hidden; }
.klip .bar div { height: 100%; width: 0; background: var(--accent); }
.ab.tre { grid-template-columns: 1fr 1fr 1fr; }
.klip .plads { margin-top: 10px; font-weight: 750; letter-spacing: .08em; color: var(--accent); min-height: 1.2em; }
.klip.valgt-klip { border-color: var(--accent); }
@media (max-width: 640px) { .ab.tre { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--kant); background: var(--flade2); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.chip small { color: var(--svag); font-size: 11px; display: block; letter-spacing: .05em; text-transform: uppercase; }
.chip.valgt { background: var(--accent); color: #1b1407; border-color: var(--accent); }
.chip.valgt small { color: #3d2f14; }
.vent { color: var(--svag); padding: 20px 0; }
.afs table { width: 100%; border-collapse: collapse; font-size: 14px; }
.afs td, .afs th { padding: 6px 4px; border-bottom: 1px solid var(--kant); text-align: left; vertical-align: top; }
.maerke { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-right: 4px; border: 1px solid; }
.maerke.aims { color: var(--aims); border-color: var(--aims); }
.maerke.vores { color: var(--vores); border-color: var(--vores); }
.stor { font-size: 22px; font-weight: 700; }
.mellem { font-weight: 650; margin: 16px 0 6px; }
.velkommen p { max-width: 62ch; }
.startbar { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 4px; }
.startbar .navnrk { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 460px; }
.startbar .navnrk input { flex: 1; min-width: 0; }
select { font: inherit; font-size: 16px; color: var(--tekst); background: var(--flade2); border: 1px solid var(--kant); border-radius: 10px; padding: 10px 12px; max-width: 460px; width: 100%; }
/* mobil: navn og Start står fast i bunden – man ruller kun i teksten (Steffen 2/11) */
@media (max-width: 640px) {
  .startbar { position: sticky; bottom: 0; z-index: 3; flex-direction: column; align-items: stretch; gap: 8px;
    margin: 12px -16px -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--flade); border-top: 1px solid var(--kant); border-radius: 0 0 12px 12px; box-shadow: 0 -8px 16px -10px #000; }
  .startbar .navnrk { max-width: none; gap: 8px; }
  .startbar select { max-width: none; }
  .startbar .knap { flex: none; }
}
@media (max-width: 520px) { .ab { grid-template-columns: 1fr; } .soegetekst { font-size: 19px; } }
</style>

<body>
<header>
  <div class="linje"><h1><img src="https://blindtest.franklymydear.dk/billeder/fmd-logo-hvid.png" alt="FMD">Filmskaber lyttetest</h1><button class="trin" id="trin" aria-expanded="false"></button></div>
  <div class="fremdrift"><div id="fremdrift"></div></div>
  <div id="oversigt" hidden></div>
</header>
<main id="indhold"><p class="vent">Henter opgaverne …</p></main>
<script>window.FMD_API = "https://search-test.franklymydear.dk";  // søgeserveren (fmd-search-test)</script>
<script>
// Siden kan ligge på blindtest.franklymydear.dk (GitHub) og hente alt fra søgeserveren (window.FMD_API), eller på serveren selv
const API = window.FMD_API || "";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tid = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const AFSPIL = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
const KARAKTERER = [["praecis", "Spot on"], ["godt", "Ok"], ["delvist", "Delvist"], ["nej", "Slet ikke"]];
const POINT = { praecis: 3, godt: 2, delvist: 1, nej: 0 };
const TYPENAVN = { kunde: "Filmskaberen søgte", brief: "Brief", soegeord: "Søgeord", lignende: "Find lignende", kendt: "Find lignende · kendt musik",
  egen: "Din egen søgning", abc: "Mest, mellem, mindst", tags: "Hvilke ord passer?" };
const LISTE = new Set(["kunde", "brief", "soegeord", "lignende", "kendt"]), REF = new Set(["lignende", "kendt"]);
const SPOERG = { kunde: "Matcher nummeret søgningen?", soegeord: "Matcher nummeret søgeordet?", brief: "Passer nummeret til briefen?",
  lignende: "Ligner nummeret referencen?", kendt: "Ligner nummeret det kendte nummer?", egen: "Matcher nummeret din søgning?" };
let naaet = -1; const faerdig = {};  // højeste opgave, testeren har nået · opgaver med alle svar givet
let opg = [], nr = 0, navn = "", rolle = "", pakke = null, lister = {}, hentes = {}, karakter = {}, egneSoeg = {}, egenNoegle = {}, abcValg = {}, tagValg = {};
const lyd = new Audio(); lyd.preload = "auto";
let spiller = null, stopVed = null, venterStart = null;

async function gem(d) {  // hver handling gemmes med det samme (Steffen 30/10: "lad os data ud af alt")
  try { await fetch(API + "/api/bt5/svar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ navn, pakke, ...d }) }); } catch {}
}

// ---- afspilning ----
const afspilNu = () => lyd.play().catch(() => {});  // afbrudt afspilning (hurtige klik) er ikke en fejl
lyd.addEventListener("loadedmetadata", () => { if (venterStart != null) { lyd.currentTime = Math.min(venterStart, Math.max(0, lyd.duration - 1)); venterStart = null; afspilNu(); } });
let efterStop = null;  // hvad der skal spille, når et klip/udsnit er færdigt (fx første nummer efter referencen)
lyd.addEventListener("timeupdate", () => {
  if (stopVed != null && lyd.currentTime >= stopVed) { lyd.pause(); stopVed = null; const f = efterStop; efterStop = null; f?.(); }
  opdaterSpil();
});
["play", "pause", "ended"].forEach(e => lyd.addEventListener(e, opdaterSpil));
function spil(noegle, url, start, varighedKlip, naarSlut) {
  efterStop = naarSlut || null;  // et nyt valg afbryder en planlagt fortsættelse
  if (spiller === noegle && !lyd.paused && start == null) { lyd.pause(); return; }
  const fra = start ?? 0;
  stopVed = varighedKlip ? fra + varighedKlip : null;
  if (spiller === noegle && lyd.src.endsWith(url) && lyd.duration) { lyd.currentTime = fra; afspilNu(); }
  else { spiller = noegle; venterStart = fra; lyd.src = url; }
  opdaterSpil();
}
function opdaterSpil() {
  document.querySelectorAll("[data-noegle]").forEach(el => {
    const er = el.dataset.noegle === spiller;
    el.classList.toggle("spiller", er);
    const b = $(".spil", el); if (b) b.innerHTML = er && !lyd.paused ? PAUSE : AFSPIL;
    const bar = $(".bar div", el);
    if (bar) bar.style.width = er && el.dataset.start ? `${Math.min(100, 100 * (lyd.currentTime - +el.dataset.start) / +el.dataset.klip)}%` : "0";
  });
  document.querySelectorAll("canvas.boelge").forEach(tegn);
}

// ---- waveforms (sidens egne) ----
const boelger = {};
const hentBoelge = id => boelger[id] ||= fetch(id.startsWith("kendt:") ? `${API}/api/bt5/boelge/${id}` : `${API}/api/boelge/${id}`).then(r => r.ok ? r.json() : null).catch(() => null);
async function tegn(c) {
  const b = await hentBoelge(c.dataset.id); if (!b) { c.style.display = "none"; return; }
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; if (!w) return;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const varighed = +c.dataset.varighed || b.sek, er = c.closest("[data-noegle]")?.dataset.noegle === spiller && lyd.duration;
  const pos = er ? lyd.currentTime / varighed : -1, felt = (c.dataset.udsnit || c.dataset.felt)?.split(",").map(Number);
  if (felt) {  // referencens udsnit / "her ligner det" på numrene i Find lignende (Steffen 2/11): samme felt med kanter
    const x0 = w * felt[0] / varighed, x1 = w * felt[1] / varighed;
    g.fillStyle = "rgba(201,164,106,.30)"; g.fillRect(x0, 0, x1 - x0, h);
    g.fillStyle = "#c9a46a"; g.fillRect(x0, 0, 2, h); g.fillRect(x1 - 2, 0, 2, h);
  }
  const bredde = 3, antal = Math.floor(w / bredde);
  for (let k = 0; k < antal; k++) {
    const v = b.streger[Math.floor(k * b.streger.length / antal)] || 0, hh = Math.max(1, v * (h - 2));
    g.fillStyle = pos >= 0 && k / antal <= pos ? "#c9a46a" : "#55524c"; g.fillRect(k * bredde, (h - hh) / 2, bredde - 1, hh);
  }
}
document.addEventListener("click", e => {
  const c = e.target.closest("canvas.boelge"); if (!c) return;
  const r = c.getBoundingClientRect(), el = c.closest("[data-noegle]");
  spil(el.dataset.noegle, el.dataset.lyd, (+c.dataset.varighed) * (e.clientX - r.left) / r.width);
});

// ---- rammen ----
const hoejde = () => document.documentElement.style.setProperty("--hoved", `${$("header").offsetHeight}px`);
addEventListener("resize", hoejde);
function visTrin() {
  const t = $("#trin");
  t.textContent = nr < opg.length ? `Opgave ${nr + 1} af ${opg.length} · ${TYPENAVN[opg[nr].type]} ▾` : `Færdig · se opgaverne ▾`;
  t.classList.add("knap-aktiv");
  $("#fremdrift").style.width = `${100 * opg.filter(o => faerdig[o.id]).length / opg.length}%`;
  if (!$("#oversigt").hidden) tegnOversigt();
  hoejde();
}
// "Næste" går til den første opgave efter denne, der ikke er færdig (og ellers den første ufærdige fra starten) –
// så man efter at have rettet en tidligere opgave kommer tilbage, hvor man slap (Steffen 2/11)
function naeste() {
  const efter = [...opg.keys()].filter(i => i > nr && !faerdig[opg[i].id]);
  const foer = [...opg.keys()].filter(i => i <= nr && !faerdig[opg[i].id]);
  gaaTil(efter[0] ?? foer[0] ?? opg.length);
}
function gaaTil(i) {
  lyd.pause(); spiller = null; nr = i; naaet = Math.max(naaet, Math.min(i, opg.length - 1));
  $("#oversigt").hidden = true; $("#trin").setAttribute("aria-expanded", "false");
  visTrin(); scrollTo(0, 0);
  if (nr >= opg.length) return slut();
  vis(opg[nr]); forhent();
}
// ---- oversigt over alle opgaver (Steffen 2/11: "hvordan kan man gå tilbage … et lille overblik") ----
function kortTekst(o) {
  if (o.type === "egen") return egneSoeg[o.id] ? `"${egneSoeg[o.id]}"` : o.scene;
  if (REF.has(o.type)) return `${o.ref.titel} – ${o.ref.kunstner}`;
  if (o.type === "abc") return o.spoergsmaal;
  if (o.type === "tags") return `${o.nummer.titel} – ${o.nummer.kunstner}`;
  return o.type === "brief" ? o.q : `"${o.q}"`;
}
function tegnOversigt() {
  $("#oversigt").innerHTML = `<p class="hjaelp" style="margin:0 0 8px">Tryk på en opgave for at gå tilbage og rette. Dine svar står der stadig.</p>` +
    opg.map((o, i) => {
      const kan = i <= naaet || faerdig[o.id], st = faerdig[o.id] ? '<span class="st ok">✓</span>' : i === nr ? '<span class="st">her</span>' : '<span class="st"></span>';
      return `<button class="rk${i === nr ? " nu" : ""}" data-gaa="${i}" ${kan ? "" : "disabled"}><span class="n">${i + 1}</span>
        <span><span class="ty">${TYPENAVN[o.type]}</span><span class="tx">${esc(kortTekst(o))}</span></span>${st}</button>`;
    }).join("");
  document.querySelectorAll("[data-gaa]").forEach(b => b.onclick = () => gaaTil(+b.dataset.gaa));
}
$("#trin").onclick = () => {
  if (!opg.length || naaet < 0) return;
  const o = $("#oversigt"); o.hidden = !o.hidden; $("#trin").setAttribute("aria-expanded", String(!o.hidden));
  if (!o.hidden) tegnOversigt();
  hoejde();
};
const hentListe = o => hentes[o.id] ||= fetch(`${API}/api/bt5/liste/${o.id}`).then(r => r.json());
function forhent() {  // næste faste lister hentes i forvejen, så testeren ikke venter
  for (const o of opg.slice(Math.max(nr, 0), Math.max(nr, 0) + 3)) if (LISTE.has(o.type)) hentListe(o);
}
// ‹ 6/13 › i opgaveblokken: tilbage til forrige, frem kun til opgaver man allerede har nået ("Næste opgave" går videre)
function saetNav() {
  const t = $("#indhold .type"); if (!t || t.querySelector(".nav")) return;
  const frem = nr + 1 < opg.length && (nr + 1 <= naaet || faerdig[opg[nr + 1].id]);
  t.insertAdjacentHTML("beforeend", `<span class="nav"><button data-nav="-1" aria-label="Forrige opgave" ${nr > 0 ? "" : "disabled"}>‹</button>
    <span>${nr + 1}/${opg.length}</span><button data-nav="1" aria-label="Næste opgave" ${frem ? "" : "disabled"}>›</button></span>`);
  t.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => gaaTil(nr + +b.dataset.nav));
}
function vis(o) {
  const el = $("#indhold");
  if (LISTE.has(o.type)) {
    el.innerHTML = `<div class="opgave"><div class="kort"><div class="type">${TYPENAVN[o.type]}</div>${hoved(o)}
      <div class="sporg">${SPOERG[o.type]}</div></div></div>
      <div id="liste"><p class="vent">Henter numre …</p></div>`;
    tegnRef(o);
    hentListe(o).then(d => { lister[o.id] = d; tegnListe(o, o.id, d); });
  } else if (o.type === "egen") visEgen(o);
  else if (o.type === "abc") visABC(o);
  else if (o.type === "tags") visTags(o);
  saetNav();
}
function hoved(o, q) {
  if (o.type === "brief") return `<div class="brief" id="brief">${esc(o.q)}</div><button class="lille" id="briefKnap" hidden>Læs hele briefen</button>`;
  if (REF.has(o.type)) return `<div class="soegetekst">${o.type === "kendt" ? "Find numre i kataloget, der ligner dette kendte nummer" : "Find numre, der ligner dette"}</div>
    <div class="nummer" data-noegle="ref:${o.id}" data-lyd="${esc(o.ref.lyd)}" style="margin-top:10px">
      <button class="spil" data-spil-ref>${AFSPIL}</button><div><div class="titel">${esc(o.ref.titel)}</div>
      <div class="kunstner">${esc(o.ref.kunstner)}${o.type === "kendt" ? " · klip på 1 minut" : o.hele ? " · hele nummeret" : ` · udsnit ${tid(o.start)}–${tid(o.slut)} (det markerede)`}</div></div>
      <canvas class="boelge" data-id="${o.ref.id}" data-varighed="${o.ref.varighed}"${o.type === "kendt" || o.hele ? "" : ` data-udsnit="${o.start},${o.slut}"`}></canvas></div>`;
  return `<div class="soegetekst${o.type === "kunde" ? " kursiv" : ""}">"${esc(q ?? o.q)}"</div>`;
}
// hele nummeret som reference: 30 sek. fra et neutralt sted spiller først (resten kan man selv klikke sig hen til)
const refStart = o => o.hele ? Math.min(30, 0.25 * o.ref.varighed) : o.start;
function tegnRef(o) {
  if (o.type === "brief") {  // lang brief: tre linjer i den faste top, resten med et tryk (fylder ellers hele mobilen)
    const b = $("#brief"), k = $("#briefKnap");
    if (b.scrollHeight > b.clientHeight + 4) { k.hidden = false; k.onclick = () => { b.classList.toggle("aaben"); k.textContent = b.classList.contains("aaben") ? "Vis mindre" : "Læs hele briefen"; hoejde(); }; }
    return;
  }
  if (!REF.has(o.type)) return;
  const el = $(`[data-noegle="ref:${o.id}"]`);
  $("[data-spil-ref]", el).onclick = () => spil(`ref:${o.id}`, o.ref.lyd, spiller === `ref:${o.id}` && !lyd.paused ? null : refStart(o));
  tegn($("canvas", el));
}

// ---- bedømmelse af en blind liste ----
function tegnListe(o, noegle, d) {
  karakter[noegle] ||= {};
  $("#liste").innerHTML = d.numre.map((n, i) => `
    <div class="nummer" data-noegle="${noegle}|${n.id}" data-lyd="${esc(n.lyd)}" data-i="${i}">
      <button class="spil">${AFSPIL}</button>
      <div><div class="titel">${esc(n.titel)}</div><div class="kunstner">${esc(n.kunstner)} · ${tid(n.varighed)}</div></div>
      <canvas class="boelge" data-id="${n.id}" data-varighed="${n.varighed}"${n.felt ? ` data-felt="${n.felt.join(",")}"` : ""}></canvas>
      <div class="karakterer">${KARAKTERER.map(([k, t], j) => `<button data-k="${k}" title="tast ${j + 1}">${t}</button>`).join("")}</div>
    </div>`).join("") + `<div class="raekke" style="margin-top:6px"><button class="knap primaer" id="videre" disabled>Næste opgave</button>
    <span class="hjaelp" id="mangler"></span></div>`;
  document.querySelectorAll("#liste .nummer").forEach(el => {
    const n = d.numre[+el.dataset.i];
    $(".spil", el).onclick = () => spil(el.dataset.noegle, n.lyd, spiller === el.dataset.noegle ? null : n.start);
    el.querySelectorAll(".karakterer button").forEach(b => b.onclick = () => saetKarakter(o, noegle, d, n, b.dataset.k));
    tegn($("canvas", el));
  });
  $("#videre").onclick = naeste;
  opdaterListe(noegle, d);
  if (d.numre.every(n => karakter[noegle][n.id])) return;  // genbesøg af en færdig opgave: intet spiller af sig selv
  const f = d.numre[0], foerste = () => spil(`${noegle}|${f.id}`, f.lyd, f.start);
  // "Find lignende": referencens udsnit spiller først, derefter det første nummer (Steffen 30/10); ellers første nummer straks
  if (REF.has(o.type)) spil(`ref:${o.id}`, o.ref.lyd, refStart(o), o.hele ? 30 : o.slut - o.start, foerste);
  else foerste();
}
function saetKarakter(o, noegle, d, n, k) {
  karakter[noegle][n.id] = k;
  if (d.numre.every(x => karakter[noegle][x.id])) { faerdig[o.id] = true; visTrin(); }
  gem({ opgave: o.id, type: o.type, noegle, q: egneSoeg[o.id] || o.q || null, reference: o.ref?.id || null, id: n.id, karakter: k });
  opdaterListe(noegle, d);
  const naesteN = d.numre.find(x => !karakter[noegle][x.id]);  // næste ubedømte spiller
  if (naesteN) spil(`${noegle}|${naesteN.id}`, naesteN.lyd, naesteN.start); else lyd.pause();
}
function opdaterListe(noegle, d) {
  document.querySelectorAll("#liste .nummer").forEach(el => {
    const id = el.dataset.noegle.split("|")[1], k = karakter[noegle][id];
    el.classList.toggle("bedoemt", !!k);
    el.querySelectorAll(".karakterer button").forEach(b => b.classList.toggle("valgt", b.dataset.k === k));
  });
  const mangler = d.numre.filter(n => !karakter[noegle][n.id]).length;
  $("#videre").disabled = mangler > 0;
  $("#mangler").textContent = mangler ? `${mangler} mangler karakter` : "Alle bedømt ✓";
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === " " && spiller) { e.preventDefault(); lyd.paused ? afspilNu() : lyd.pause(); return; }
  const j = ["1", "2", "3", "4"].indexOf(e.key);
  if (j >= 0 && spiller?.includes("|")) { const el = $(`[data-noegle="${CSS.escape(spiller)}"] .karakterer button[data-k="${KARAKTERER[j][0]}"]`); el?.click(); }
});

// ---- din egen søgning ----
function visEgen(o, forrige = "", formular = false) {
  if (!formular && egenNoegle[o.id] && lister[egenNoegle[o.id]]) return visEgenListe(o, egneSoeg[o.id], lister[egenNoegle[o.id]]);
  $("#indhold").innerHTML = `<div id="egenTop"><div class="kort"><div class="type">${TYPENAVN.egen}</div>
    <div class="soegetekst" style="font-size:18px;font-weight:600">${esc(o.scene)}</div>
    <div class="sporg" style="font-size:17px">Hvad ville du skrive i søgefeltet for at finde musik til scenen?</div>
    <textarea id="egenQ" rows="2" placeholder="Skriv som du plejer – dansk eller engelsk, kort eller langt">${esc(forrige)}</textarea>
    <div class="raekke" style="margin-top:10px"><button class="knap primaer" id="egenSoeg">Søg</button>
      <span class="hjaelp">Begge musikmotorer søger nu – du ser svarene blandet og uden navne.</span></div></div></div>
    <div id="liste"></div>`;
  const soeg = async () => {
    const q = $("#egenQ").value.trim(); if (!q) return;
    $("#egenSoeg").disabled = true;
    $("#liste").innerHTML = '<p class="vent">Begge motorer søger … (ca. 3–5 sek.)</p>';
    gem({ opgave: o.id, type: "egen", egen_soegning: q });
    const t0 = performance.now();
    const r = await fetch(`${API}/api/bt5/egen/${o.id}?${new URLSearchParams({ q, navn })}`);
    $("#egenSoeg").disabled = false;
    if (!r.ok) { $("#liste").innerHTML = `<p class="vent">Det gik galt: ${esc((await r.json()).detail)}</p>`; return; }
    const d = await r.json();
    egneSoeg[o.id] = q; egenNoegle[o.id] = d.noegle; lister[d.noegle] = d;
    gem({ opgave: o.id, type: "egen", egen_soegning: q, ventetid_sek: Math.round((performance.now() - t0) / 100) / 10, sek: d.sek });
    faerdig[o.id] = false; visTrin();
    visEgenListe(o, q, d);
  };
  $("#egenSoeg").onclick = soeg;
  $("#egenQ").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); soeg(); } });
  $("#egenQ").focus();
  saetNav();
}
// Efter søgningen: kompakt, fast top med scenen, din søgning og spørgsmålet (Steffen 30/10: opgaven skal være sticky)
function visEgenListe(o, q, d) {
  $("#indhold").innerHTML = `<div class="opgave"><div class="kort"><div class="type">${TYPENAVN.egen}</div>
      <div class="scene-lille">${esc(o.scene)}</div><div class="soegetekst kursiv">"${esc(q)}"</div>
      <button class="lille" id="retSoeg">Ret din søgning</button>
      <div class="sporg">${SPOERG.egen}</div></div></div><div id="liste"></div>`;
  $("#retSoeg").onclick = () => { lyd.pause(); visEgen(o, q, true); };
  tegnListe(o, d.noegle, d);
  saetNav();
}

// ---- A/B/C: mest, mellem, mindst (Steffen 30/10) ----
function visABC(o) {
  const tidl = abcValg[o.id], valg = Array.isArray(tidl) ? { mest: "abc".indexOf(tidl[0]), mindst: "abc".indexOf(tidl[2]) } : { mest: null, mindst: null };
  $("#indhold").innerHTML = `<div class="opgave"><div class="kort"><div class="type">${TYPENAVN.abc}</div>
    <div class="soegetekst">${esc(o.spoergsmaal)}</div>
    <p class="hjaelp">Lyt til de tre klip (${o.klip} sek. hver – de spiller efter hinanden). Tryk <b>Mest</b> på det, der passer bedst, og
      <b>Mindst</b> på det, der passer dårligst. Det sidste bliver Mellem. Der er intet rigtigt svar – det er din fornemmelse, vi vil lære af.</p>
    <div class="sporg" id="abcStatus" style="font-size:16px">Vælg Mest …</div></div></div>
    <div class="ab tre">${o.klip_liste.map((k, i) => `<div class="klip" data-noegle="${o.id}:${i}" data-start="${k.start}" data-klip="${o.klip}">
      <div class="bogstav">${"ABC"[i]}</div><button class="spil" style="margin:0 auto">${AFSPIL}</button><div class="bar"><div></div></div>
      <div class="raekke" style="justify-content:center"><button class="knap" data-mest="${i}">Mest</button><button class="knap" data-mindst="${i}">Mindst</button></div>
      <div class="plads" data-plads="${i}"></div></div>`).join("")}</div>
    <div class="raekke" style="margin-top:12px"><button class="knap primaer" id="abcVidere" disabled>Næste</button>
      <button class="knap" id="abcLige">Kan ikke skelne</button></div>`;
  const kaede = i => () => { const k = o.klip_liste[i]; spil(`${o.id}:${i}`, k.lyd, k.start, o.klip, i < 2 ? kaede(i + 1) : null); };
  document.querySelectorAll(".klip").forEach((el, i) => {
    const k = o.klip_liste[i];
    $(".spil", el).onclick = () => spil(el.dataset.noegle, k.lyd, spiller === el.dataset.noegle && !lyd.paused ? null : k.start, o.klip);
  });
  const opdater = () => {
    const mellem = valg.mest != null && valg.mindst != null ? [0, 1, 2].find(i => i !== valg.mest && i !== valg.mindst) : null;
    document.querySelectorAll("[data-plads]").forEach(el => {
      const i = +el.dataset.plads;
      el.textContent = i === valg.mest ? "MEST" : i === valg.mindst ? "MINDST" : i === mellem ? "MELLEM" : "";
      el.closest(".klip").classList.toggle("valgt-klip", el.textContent !== "");
    });
    document.querySelectorAll("[data-mest]").forEach(b => b.classList.toggle("primaer", +b.dataset.mest === valg.mest));
    document.querySelectorAll("[data-mindst]").forEach(b => b.classList.toggle("primaer", +b.dataset.mindst === valg.mindst));
    $("#abcStatus").textContent = valg.mest == null ? `Vælg Mest …` : valg.mindst == null ? "Vælg Mindst …"
      : `Din rækkefølge: ${"ABC"[valg.mest]} › ${"ABC"[mellem]} › ${"ABC"[valg.mindst]}`;
    $("#abcVidere").disabled = mellem == null;
    return mellem;
  };
  document.querySelectorAll("[data-mest]").forEach(b => b.onclick = () => { valg.mest = +b.dataset.mest; if (valg.mindst === valg.mest) valg.mindst = null; opdater(); });
  document.querySelectorAll("[data-mindst]").forEach(b => b.onclick = () => { valg.mindst = +b.dataset.mindst; if (valg.mest === valg.mindst) valg.mest = null; opdater(); });
  $("#abcVidere").onclick = () => {
    const mellem = opdater(), raekke = [valg.mest, mellem, valg.mindst].map(i => "abc"[i]);
    abcValg[o.id] = raekke; faerdig[o.id] = true; gem({ opgave: o.id, type: "abc", raekkefoelge: raekke, spoergsmaal: o.spoergsmaal }); naeste();
  };
  $("#abcLige").onclick = () => { abcValg[o.id] = "lige"; faerdig[o.id] = true; gem({ opgave: o.id, type: "abc", raekkefoelge: "lige", spoergsmaal: o.spoergsmaal }); naeste(); };
  opdater();
  if (tidl === "lige") $("#abcStatus").textContent = "Du valgte: Kan ikke skelne";
  if (!tidl) kaede(0)();  // A, B og C spiller efter hinanden (ikke ved genbesøg)
}

// ---- tags ----
function visTags(o) {
  const n = o.nummer;
  tagValg[o.id] ||= new Set();
  $("#indhold").innerHTML = `<div class="opgave"><div class="kort"><div class="type">${TYPENAVN.tags}</div>
    <div class="nummer" data-noegle="tag:${o.id}" data-lyd="${esc(n.lyd)}" style="margin:6px 0 0">
      <button class="spil">${AFSPIL}</button><div><div class="titel">${esc(n.titel)}</div><div class="kunstner">${esc(n.kunstner)} · ${tid(n.varighed)}</div></div>
      <canvas class="boelge" data-id="${n.id}" data-varighed="${n.varighed}"></canvas></div>
    <div class="sporg">Hvilke ord passer på nummeret? Vælg alle, der passer.</div></div></div>
    <div class="kort"><div class="chips">${o.valg.map(v => `<button class="chip" data-tag="${esc(v.tag)}"><small>${esc(v.gruppe)}</small>${esc(v.navn)}</button>`).join("")}</div>
    <div class="raekke" style="margin-top:14px"><button class="knap primaer" id="tagsVidere">Næste</button>
      <span class="hjaelp">Ingen passer? Tryk bare Næste.</span></div></div>`;
  const el = $(`[data-noegle="tag:${o.id}"]`);
  $(".spil", el).onclick = () => spil(`tag:${o.id}`, n.lyd, spiller === `tag:${o.id}` ? null : o.start);
  tegn($("canvas", el));
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const t = c.dataset.tag, s = tagValg[o.id]; s.has(t) ? s.delete(t) : s.add(t); c.classList.toggle("valgt", s.has(t));
  });
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("valgt", tagValg[o.id].has(c.dataset.tag)));
  $("#tagsVidere").onclick = () => { faerdig[o.id] = true; gem({ opgave: o.id, type: "tags", id: n.id, valgt: [...tagValg[o.id]], vist: o.valg.map(v => v.tag) }); naeste(); };
  if (!faerdig[o.id]) spil(`tag:${o.id}`, n.lyd, o.start);
}

// ---- slut (testerne ser ikke, hvem der fandt hvad) ----
function slut() {
  $("#indhold").innerHTML = `<div class="kort"><div class="stor">Tak – du er færdig!</div>
    <p>Alle dine svar er gemt undervejs – du behøver ikke sende noget. Tusind tak for hjælpen.</p>

}

// navnet huskes i browseren på denne enhed, så feltet er udfyldt næste gang (som i de tidligere blindtests)
const NAVN_NOEGLE = "fmd-blindtest5-navn";
const huskNavn = () => { try { return localStorage.getItem(NAVN_NOEGLE) || ""; } catch { return ""; } };

// ---- genoptag: samme navn henter de svar, man allerede har givet (genindlæst side, anden enhed) ----
async function genoptag() {
  let svar = [];
  try { svar = (await (await fetch(`${API}/api/bt5/mine?${new URLSearchParams({ navn })}`)).json()).svar; } catch { return; }
  const egenQ = {};
  for (const x of svar) {  // nyeste svar vinder
    if (x.karakter && x.noegle) (karakter[x.noegle] ||= {})[x.id] = x.karakter;
    if (x.type === "egen" && x.egen_soegning) egenQ[x.opgave] = x.egen_soegning;
    if (x.type === "abc" && x.raekkefoelge) { abcValg[x.opgave] = x.raekkefoelge; faerdig[x.opgave] = true; }
    if (x.type === "tags" && x.valgt) { tagValg[x.opgave] = new Set(x.valgt); faerdig[x.opgave] = true; }
  }
  await Promise.all(opg.map(async (o, i) => {
    if (LISTE.has(o.type) && karakter[o.id]) {
      const d = await hentListe(o); lister[o.id] = d;
      faerdig[o.id] = d.numre.every(n => karakter[o.id][n.id]);
    } else if (o.type === "egen" && egenQ[o.id]) {
      const r = await fetch(`${API}/api/bt5/egen/${o.id}?${new URLSearchParams({ q: egenQ[o.id], navn })}`);
      if (!r.ok) return;
      const d = await r.json();
      egneSoeg[o.id] = egenQ[o.id]; egenNoegle[o.id] = d.noegle; lister[d.noegle] = d;
      faerdig[o.id] = d.numre.every(n => (karakter[d.noegle] || {})[n.id]);
    }
  }));
  opg.forEach((o, i) => { if (faerdig[o.id] || karakter[o.id] || egneSoeg[o.id]) naaet = Math.max(naaet, i); });
}

      const r = await fetch(`${API}/api/bt5/start?${new URLSearchParams({ navn, rolle, ...(pk ? { pakke: pk } : {}) })}`);
      if (!r.ok) throw new Error((await r.json()).detail);
      const d = await r.json(); pakke = d.pakke;
      opg = d.opgaver.map(o => o.ref?.lyd?.startsWith("/") ? { ...o, ref: { ...o.ref, lyd: API + o.ref.lyd } } : o);
    } catch (e) {
      $("#start").disabled = false; $("#start").textContent = "Start";
      const f = $("#startFejl"); f.hidden = false; f.textContent = "Testen kunne ikke hentes – tjek forbindelsen og prøv igen."; return;
    }
    forhent();
    await genoptag();
    gem({ start: true, rolle, enhed: matchMedia("(max-width: 640px)").matches ? "mobil" : "computer" }); nr = -1; naeste();
  };
})();
</script>
