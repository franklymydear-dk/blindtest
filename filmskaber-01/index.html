<script>
/* Fritstående udgave: siden taler ikke med en server – svarene laves her, og karakterer gemmes i browseren. */
(function () {
  const D = window.FMD_DATA;
  // Webudgaven: testerens kode fra linket (…/?t=thomas) – bruges som id, så vi ikke behøver navne/mails
  D.kode = (new URLSearchParams(location.search).get("t") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
  const NOEGLE = `fmd-blindtest-${D.runde}-${D.version}${D.kode ? "-" + D.kode : ""}`;
  let tilstand = { tester: "", bedoemmelser: {} };
  try { const s = localStorage.getItem(NOEGLE); if (s) tilstand = JSON.parse(s); } catch (e) {}
  // Pakker (Filmskaber 01): hver tester får 2 fælles + 8 egne søgninger og 5 A/B-par – fast ud fra navnet
  const PAKKE_LINK = new URLSearchParams(location.search).get("pakke");
  function pakkeFor(navn) {
    if (PAKKE_LINK) return PAKKE_LINK;
    let h = 5381;
    for (const c of navn.toLowerCase().split(/\s+/).filter(Boolean).join(" ")) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0;
    return String(D.pakker.pakker[h % D.pakker.pakker.length].id);
  }
  if (D.pakker && tilstand.tester) {
    tilstand.pakke ||= pakkeFor(tilstand.tester);
    if (tilstand.pakke !== "alle") {
      const pk = D.pakker.pakker.find(p => String(p.id) === String(tilstand.pakke)) || D.pakker.pakker[0];
      const raek = new Map(pk.opgaver.map((id, i) => [id, i]));
      D.puljer = D.puljer.filter(o => raek.has(o.id)).sort((a, b) => raek.get(a.id) - raek.get(b.id));
      D.mine_ab = pk.ab;
    } else D.mine_ab = D.pakker.pakker.flatMap(p => p.ab).filter((x, i, a) => a.indexOf(x) === i);
  }
  tilstand.ab ||= {};
  // A/B-sammenligningerne står i listen mellem søgningerne – én efter hver anden søgning – og tæller med i fremdriften
  // (Steffen 2026-10-27: på lige fod med de andre spørgsmål, ikke en skjult bonus til sidst)
  if (D.ab && D.mine_ab?.length) {
    const ab = D.mine_ab.filter(id => D.ab[id]).map((id, k, a) => ({ id: "ab-" + id, type: "ab",
      kunde: D.ab[id].spoergsmaal, numre: [], ab: D.ab[id], abNr: k + 1, abAntal: a.length }));
    const ud = [];
    D.puljer.forEach((o, i) => { ud.push(o); if (i % 2 === 1 && ab.length) ud.push(ab.shift()); });
    D.puljer = ud.concat(ab);
  }
  // Dansk tid ("2026-10-24 01:08:30") i stedet for UTC
  const lokalTid = () => new Date().toLocaleString("sv-SE");
  function gem() { try { localStorage.setItem(NOEGLE, JSON.stringify(tilstand)); } catch (e) {} }
  const svar = (d, status = 200) => Promise.resolve(new Response(JSON.stringify(d),
    { status, headers: { "Content-Type": "application/json" } }));
  function pakUd(t) { const s = []; for (const c of t) s.push(D.tegn.indexOf(c) / 63); return s; }
  const ægte = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    const u = String(url);
    if (u.startsWith("/api/opgaver")) return svar({ opgaver: D.puljer, bedoemmelser: tilstand.bedoemmelser,
      navn: D.navn, ord: "System", ord_lille: "system", skala: D.skala, spoergsmaal: D.spoergsmaal });
    if (u.startsWith("/api/bedoem")) {
      const b = JSON.parse(opts.body);
      if (b.karakter) (tilstand.bedoemmelser[b.opgave] ||= {})[b.nummer] =
        { karakter: b.karakter, tid: lokalTid() };
      else delete tilstand.bedoemmelser[b.opgave]?.[b.nummer];
      gem(); opdaterSendKnap(); autoGem();
      setTimeout(sjekFaerdig, 1500);  // sidste svar i pakken → takkeskærm
      return svar({ ok: true });
    }
    if (u.startsWith("/api/boelge/")) {
      const w = D.boelger[u.split("/").pop()];
      return w ? svar({ streger: pakUd(w[0]), sek: w[1] }) : svar({ detail: "ingen" }, 404);
    }
    if (u.startsWith("/api/resultat")) return svar({ faerdige: 0, i_alt: D.puljer.length, modeller: [] });
    return ægte(url, opts);
  };

  function antal() {
    let klar = 0, alle = 0;
    for (const o of D.puljer) {
      if (o.type === "ab") { alle++; if (tilstand.ab[o.ab.id]) klar++; continue; }  // en sammenligning = ét svar
      for (const n of o.numre) { alle++; if (tilstand.bedoemmelser[o.id]?.[n.id]) klar++; }
    }
    return { klar, alle };
  }
  function opdaterSendKnap() {
    const b = document.getElementById("sendResultat"); if (!b) return;
    const { klar, alle } = antal();
    if (D.web) {  // webudgaven gemmer selv – knappen afslutter bare (Steffen 2026-10-27: tydeligt at intet skal sendes)
      b.textContent = klar >= alle ? "✓ Færdig – alt er gemt hos Frankly" : "Gemmes automatisk · afslut";
    } else b.textContent = klar >= alle ? "Færdig – send resultatet til Frankly" : "Send resultatet til Frankly";
    b.classList.toggle("primaer", klar >= alle);
  }
  // ---- Webudgaven (blindtest.franklymydear.dk): karakterer sendes automatisk til jeres eget webhotel ----
  function pakke(endelig) {
    const { klar, alle } = antal();
    return { test: D.navn, udgave: D.udgave || "fuld", runde: D.runde, version: D.version,
      tester: tilstand.tester || "ukendt", kode: D.kode || "", sendt: lokalTid(), endelig: !!endelig,
      bedoemt: klar, i_alt: alle, bedoemmelser: tilstand.bedoemmelser,
      enhed: /Mobi|iPhone|iPad|Android/.test(navigator.userAgent) || matchMedia("(max-width: 760px)").matches ? "mobil" : "computer",
      sete_beskeder: sete, rolle: tilstand.rolle || "", sprog: tilstand.sprog || "",
      pakke: tilstand.pakke || "", ab: tilstand.ab || {} };
  }
  async function post(endelig) {
    // text/plain = "simpel" forespørgsel uden forhåndstjek, så den også virker fra en anden adresse (GitHub Pages)
    const r = await ægte(D.gemUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify(pakke(endelig)), keepalive: !endelig });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  let gemTimer = null;
  function gemStatus(t) { const s = document.getElementById("gemStatus"); if (s) s.textContent = t; }
  function autoGem() {
    if (!D.web) return;
    clearTimeout(gemTimer);
    gemStatus("gemmer …");
    gemTimer = setTimeout(() => post(false).then(() => gemStatus("✓ gemt hos Frankly"))
      .catch(() => gemStatus("⚠ ikke gemt online endnu – gemt i browseren")), 1500);
  }
  addEventListener("pagehide", () => { if (D.web && antal().klar) { clearTimeout(gemTimer); post(false).catch(() => {}); } });

  async function send() {
    const { klar, alle } = antal();
    if (!klar) return alert("Du har ikke givet nogen karakterer endnu.");
    if (D.web) {
      if (klar < alle && !confirm(`Du har bedømt ${klar} af ${alle} numre, og det er allerede gemt hos Frankly. Vil du afslutte nu? Du kan altid fortsætte senere.`)) return;
      try {
        await post(true);
        gemStatus("✓ sendt til Frankly");
        alert(klar >= alle ? "Tak! Alt er gemt hos Frankly My Dear. Du behøver ikke sende noget – du kan bare lukke siden."
          : `Tak! ${klar} af ${alle} numre er gemt hos Frankly. Du kan fortsætte, når du vil.`);
      } catch (e) {
        alert("Det lykkedes ikke at sende lige nu – tjek internetforbindelsen og prøv igen. Dine karakterer er gemt i browseren.");
      }
      return;
    }
    if (klar < alle && !confirm(`Du har bedømt ${klar} af ${alle} numre. Vil du sende det, du har nu? (Du kan fortsætte og sende igen senere.)`)) return;
    const navn = tilstand.tester || "ukendt";
    const data = { test: D.navn, udgave: D.udgave || "fuld", runde: D.runde, version: D.version, tester: navn,
      sendt: lokalTid(), bedoemt: klar, i_alt: alle, bedoemmelser: tilstand.bedoemmelser };
    const filnavn = `${D.navn.replace(/\s+/g, "-")}-${navn.replace(/[^\wæøåÆØÅ-]+/g, "_")}.json`;
    const fil = new File([JSON.stringify(data)], filnavn, { type: "application/json" });
    const emne = `${D.navn} – resultat fra ${navn}`;
    try {
      if (navigator.canShare && navigator.canShare({ files: [fil] })) {
        await navigator.share({ files: [fil], title: emne, text: `Send til ${D.modtager}` });
        return;
      }
    } catch (e) { if (e.name === "AbortError") return; }
    // Reserve: hent filen ned og åbn en ny mail – testeren trækker filen fra "Overførsler" ind i mailen.
    const a = document.createElement("a");
    a.href = URL.createObjectURL(fil); a.download = filnavn; document.body.appendChild(a); a.click(); a.remove();
    const tekst = `Hej Steffen\n\nHer er mit resultat fra ${D.navn} (${klar} af ${alle} numre bedømt).\n\n` +
      `HUSK: træk filen "${filnavn}" fra mappen Overførsler ind i denne mail, før du sender.\n\nHilsen ${navn}`;
    setTimeout(() => { location.href = `mailto:${D.modtager}?subject=${encodeURIComponent(emne)}&body=${encodeURIComponent(tekst)}`; }, 600);
    alert(`Filen "${filnavn}" er gemt i Overførsler, og en ny mail åbner nu.\n\nTræk filen ind i mailen, og tryk Send.`);
  }

  const esc = s => String(s).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  function visTester() {
    const u = document.querySelector("header .under");
    u?.querySelector(".tester")?.remove();
    u?.insertAdjacentHTML("beforeend", ` <span class="tester" style="opacity:.7">· Tester: ${esc(tilstand.tester)} ·
      <a id="skiftNavn" style="color:var(--accent);cursor:pointer;text-decoration:underline">skift navn</a></span>`);
    u?.querySelector("#skiftNavn")?.addEventListener("click", skiftNavn);
  }
  // "Skift navn" (Steffen 2026-10-24): starter forfra på denne enhed – det, der er gemt hos Frankly, bliver liggende
  function skiftNavn() {
    if (!confirm(`Skift navn og start forfra på denne enhed?\n\nKaraktererne, du har givet som "${tilstand.tester}", ` +
      `er allerede gemt hos Frankly og bliver liggende.`)) return;
    tilstand = { tester: "", bedoemmelser: {} }; gem(); location.reload();
  }
  window.fmdSkiftNavn = skiftNavn;
  // Velkomstskærm (første gang): ikon, kort vejledning og navn – så det føles som at åbne en app.
  // Beskeder fra Frankly (Steffen 2026-10-24): ../besked.json vises som popup – én gang pr. besked, ingen svar.
  // {"beskeder": [{"id": "b1", "til": "alle" | "<fulde navn>", "runde": "2" (valgfri), "tekst": "…"}]}
  const SETE = "fmd-blindtest-sete-beskeder";
  let sete = [];
  try { sete = JSON.parse(localStorage.getItem(SETE) || "[]"); } catch (e) {}
  const norm = x => String(x || "").toLowerCase().split(/\s+/).filter(Boolean).join(" ");
  async function tjekBeskeder() {
    if (!D.web || !tilstand.tester || document.getElementById("besked") || document.getElementById("velkomst")) return;
    let d;
    try { d = await (await ægte("../besked.json?x=" + Date.now(), { cache: "no-store" })).json(); } catch (e) { return; }
    const b = (d.beskeder || []).find(x => x.id && x.tekst && !sete.includes(x.id) &&
      (!x.til || norm(x.til) === "alle" || norm(x.til) === norm(tilstand.tester)) &&
      (!x.runde || String(x.runde) === String(D.runde)));
    if (!b || document.getElementById("besked")) return;
    const v = document.createElement("div");
    v.id = "besked";
    v.innerHTML = `<div class="kort"><img src="${D.ikon}" alt="" width="56" height="56">
      <div class="fra">Besked fra Frankly My Dear</div><p>${esc(b.tekst).replace(/\n/g, "<br>")}</p>
      <button class="knap primaer">OK</button></div>`;
    document.body.appendChild(v);
    v.querySelector("button").onclick = () => {
      sete.push(b.id);
      try { localStorage.setItem(SETE, JSON.stringify(sete)); } catch (e) {}
      v.remove(); tjekBeskeder();  // evt. næste besked
      if (D.web) post(false).catch(() => {});  // kvittering: Frankly kan se, at beskeden er læst
    };
  }
  setInterval(tjekBeskeder, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tjekBeskeder(); });

  // Karakterer fra TIDLIGERE runder på den samme søgning (samme tekst) udfyldes, når testeren har skrevet sit navn.
  // Navnene ligger ikke i siden – kun en kort SHA-1 af det fulde navn (små bogstaver).
  async function forudfyld() {
    const t = D.tidligere;
    if (!t || !tilstand.tester || tilstand.forudfyldt || !window.crypto?.subtle) return;
    tilstand.forudfyldt = true;
    const navn = tilstand.tester.toLowerCase().split(/\s+/).filter(Boolean).join(" ");
    const h = [...new Uint8Array(await crypto.subtle.digest("SHA-1", new TextEncoder().encode(navn)))]
      .map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 12);
    let ny = 0;
    for (const [oid, numre] of Object.entries(t[h] || {}))
      for (const [nid, k] of Object.entries(numre))
        if (!tilstand.bedoemmelser[oid]?.[nid]) { (tilstand.bedoemmelser[oid] ||= {})[nid] = { karakter: k, tid: "tidligere runde" }; ny++; }
    gem();
    if (!ny) return;
    if (D.web) await post(false).catch(() => {});
    location.reload();  // siden tegnes forfra med de udfyldte karakterer
  }

  function velkomst() {
    const v = document.createElement("div");
    v.id = "velkomst";
    v.innerHTML = `<div class="kort">
      <img src="${D.ikon}" alt="" width="112" height="112">
      <h2>${esc(D.navn)}</h2>
      <p class="kort-tekst">Lyt til musik, og bedøm, hvor godt den passer til søgningen.</p>
      <p class="kort-tekst svag">Du kan holde pause undervejs.</p>
      <div class="mere"><p>Frankly My Dear tester to musiksøgemaskiner. Du ser en søgning – som en kunde har skrevet den – og
        en række numre. Lyt, og giv hvert nummer en karakter: ${D.skala.map(x => `<b>${x[1]}</b>`).join(", ").replace(/, ([^,]*)$/, " eller $1")}.
        Du får ikke at vide, hvilken søgemaskine der fandt hvad.</p>
      <p><b>Bedøm, hvor godt musikken passer til søgningen – ikke om du selv kan lide den.</b>
        Et godt nummer i den forkerte stemning får <b>${D.skala.at(-1)[1]}</b>.</p>
      <p class="lille"><span class="kun-tastatur">Tasterne 1–4 giver karakter, mellemrum afspiller, F springer 30 sek. frem.</span>
        Tryk i waveformen for at lytte et bestemt sted. Dine karakterer gemmes i browseren, så du kan holde pause og komme tilbage.
        Når du er færdig: tryk <b>Send resultatet til Frankly</b> (på mobil i menuen ≡).</p></div>
      <label>Dit fulde navn<input id="velkomstNavn" autocomplete="name" enterkeyhint="go" placeholder="Fx Thomas Hansen"></label>
      <button class="knap primaer" id="velkomstStart">Start</button>
      <button class="saadan" id="velkomstSaadan">Sådan virker det</button></div>`;
    // Testerens rolle (Steffen 2026-10-26: så vi kan se, om fagfolk vurderer anderledes)
  const ROLLER = [["", "Vælg …", "Choose …"], ["instruktoer", "Instruktør", "Director"], ["klipper", "Klipper", "Editor"],
    ["music_supervisor", "Music supervisor", "Music supervisor"], ["producer", "Producer", "Producer"],
    ["manuskript", "Manuskriptforfatter", "Screenwriter"], ["komponist", "Komponist / musiker", "Composer / musician"],
    ["reklame", "Reklame / bureau", "Advertising / agency"], ["studerende", "Filmstuderende", "Film student"],
    ["andet", "Andet", "Other"]];
  // Introtekst fra runden (<runde>/intro.json, Steffen 2026-10-26): dansk eller engelsk efter browserens sprog;
    // vejledningen ligger så bag "Sådan virker det" – også på computeren
    // Dansk som standard (Steffen 2026-10-26); engelsk med knappen eller et link med ?sprog=en
    if (D.intro) {
      v.classList.add("med-intro");
      v.querySelectorAll(".kort-tekst").forEach(e => e.remove());
      v.querySelector("label").insertAdjacentHTML("afterend", `<label id="rolleLabel"><span></span><select id="velkomstRolle">
        ${ROLLER.map(r => `<option value="${r[0]}"></option>`).join("")}</select></label>`);
      v.querySelector(".kort").insertAdjacentHTML("afterbegin", '<button class="sprogknap" id="velkomstSprog" type="button"></button>');
      const tegn = (sprog) => {
        const L = D.intro[sprog] || D.intro.da, en = sprog === "en";
        v.dataset.sprog = sprog;
        v.querySelectorAll("p.intro").forEach(e => e.remove());
        const h = v.querySelector("h2");
        h.textContent = L.titel;
        h.insertAdjacentHTML("afterend", L.afsnit.map(a => `<p class="intro">${esc(a)}</p>`).join(""));
        v.querySelector("label").firstChild.textContent = L.navn;
        v.querySelector("#velkomstNavn").placeholder = en ? "E.g. Thomas Hansen" : "Fx Thomas Hansen";
        v.querySelector("#rolleLabel span").textContent = en ? "What do you work with?" : "Hvad arbejder du med?";
        v.querySelectorAll("#velkomstRolle option").forEach((o, i) => o.textContent = ROLLER[i][en ? 2 : 1]);
        v.querySelector("#velkomstStart").textContent = L.start;
        v.querySelector("#velkomstSaadan").textContent = en ? "How it works" : "Sådan virker det";
        v.querySelector("#velkomstSprog").textContent = en ? "Dansk" : "English";
      };
      const fraLink = new URLSearchParams(location.search).get("sprog");
      tegn(fraLink === "en" && D.intro.en ? "en" : "da");
      v.querySelector("#velkomstSprog").onclick = () => tegn(v.dataset.sprog === "en" ? "da" : "en");
    }
    document.body.appendChild(v);
    const felt = v.querySelector("#velkomstNavn"), knap = v.querySelector("#velkomstStart");
    const start = () => {
      const n = felt.value.trim(); if (!n) { felt.focus(); return; }
      const r = v.querySelector("#velkomstRolle");
      if (r && !r.value) { r.focus(); r.classList.add("mangler"); return; }
      if (r) { tilstand.rolle = r.value; tilstand.sprog = v.dataset.sprog || "da"; }
      tilstand.tester = n; gem(); visTester(); v.remove();
      if (D.pakker && !tilstand.pakke) { tilstand.pakke = pakkeFor(n); gem(); location.reload(); return; }
      forudfyld(); tjekBeskeder();
    };
    knap.onclick = start;
    v.querySelector("#velkomstSaadan").onclick = () => v.classList.toggle("vis-mere");
    felt.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") start(); });
    // på mobil åbner vi ikke tastaturet af sig selv – det skubber skærmen rundt
    if (!matchMedia("(max-width: 760px)").matches) setTimeout(() => felt.focus(), 50);
  }

  // ---- A/B-sammenligninger: opgaver i listen (type "ab"), tegnet her og gemt i tilstand.ab ----
  const AB_TEKST = {
    da: { chip: "Sammenligning", tekst: "Lyt til begge klip, og vælg det, der passer bedst til spørgsmålet.",
          lige: "Lige godt / ved ikke", af: "af", klip: "sek.",
          tak: "Tak! Alt er gemt hos Frankly My Dear.", tak2: "Du behøver ikke sende noget – du kan bare lukke siden.",
          luk: "Luk", afspil: "Afspil", pause: "Pause", vaelg: "Vælg", valgt: "✓ Valgt", ligeValgt: "✓ Lige godt / ved ikke" },
    en: { chip: "Comparison", tekst: "Listen to both clips and choose the one that best fits the question.",
          lige: "Equally / not sure", af: "of", klip: "sec.",
          tak: "Thank you! Everything is saved with Frankly My Dear.", tak2: "You don't need to send anything – you can simply close the page.",
          luk: "Close", afspil: "Play", pause: "Pause", vaelg: "Choose", valgt: "✓ Chosen", ligeValgt: "✓ Equally / not sure" },
  };
  const abT = () => AB_TEKST[tilstand.sprog === "en" ? "en" : "da"];
  // A/B-afspiller (Steffen 2026-10-27): tydeligt hvad der spiller, en bar for hvor langt klippet er, og stilhed ved valg
  const abLyd = new Audio();
  let abAktiv = null, abKlip = null;  // "a"/"b" og klippets {start, klip}
  function abOpdater() {
    document.querySelectorAll("#ab-flade .ab-klip").forEach(el => {
      const x = el.dataset.klip, spiller = x === abAktiv && !abLyd.paused;
      el.classList.toggle("spiller", x === abAktiv);
      const knap = el.querySelector("[data-afspil-ab]");
      if (knap) knap.innerHTML = spiller ? "❚❚ " + abT().pause : "▶ " + abT().afspil;
      const bar = el.querySelector(".ab-bar i");
      if (bar) bar.style.width = (x === abAktiv && abKlip ? Math.min(100, 100 * Math.max(0, abLyd.currentTime - abKlip.start) / abKlip.klip) : 0) + "%";
    });
  }
  function abStop() { abLyd.pause(); abAktiv = null; abKlip = null; abOpdater(); }
  function afspilKlip(x, k) {
    if (typeof lyd !== "undefined") lyd.pause();  // stop den almindelige afspiller
    if (abAktiv === x && !abLyd.paused) { abLyd.pause(); abOpdater(); return; }  // samme klip igen = pause
    if (abAktiv === x && abLyd.paused && abKlip) { abLyd.play(); abOpdater(); return; }
    abAktiv = x; abKlip = { start: k.start || 0, klip: k.klip || 12 };
    abLyd.src = k.lyd;
    abLyd.onloadedmetadata = () => { abLyd.currentTime = abKlip.start; abLyd.play(); };
    abOpdater();
  }
  abLyd.addEventListener("timeupdate", () => {
    if (abKlip && abLyd.currentTime >= abKlip.start + abKlip.klip) return abStop();  // klippet er slut: sluk markeringen
    abOpdater();
  });
  ["play", "pause", "ended"].forEach(e => abLyd.addEventListener(e, abOpdater));

  // Én sammenligning som opgave i listen – samme opbygning som en søgning: spørgsmålet øverst, de to klip under
  function abTegn(o, el, mobil, efter) {
    const T = abT(), p = o.ab, valgt = tilstand.ab[p.id];
    el.innerHTML = `<div class="prompt ab-spoerg"><span class="chip">${T.chip} · ${o.abNr} ${T.af} ${o.abAntal}</span>
        <p class="kunde">${esc(p.spoergsmaal)}</p></div>
      <p class="vejledning ab-vejl">${T.tekst} <span class="ab-sek">${p.klip_sek} ${T.klip}</span></p>
      <div class="ab-par">${["a", "b"].map(x => `<div class="ab-klip ${valgt === x ? "valgt" : ""}" data-klip="${x}">
          <div class="ab-bogstav">${x.toUpperCase()}</div>
          <button class="knap ab-afspil" data-afspil-ab="${x}">▶ ${T.afspil}</button>
          <div class="ab-bar"><i></i></div>
          <button class="knap ${valgt === x ? "valgt" : "primaer"}" data-valg="${x}">${valgt === x ? T.valgt : `${T.vaelg} ${x.toUpperCase()}`}</button></div>`).join("")}</div>
      <button class="ab-lige ${valgt === "lige" ? "valgt" : ""}" data-valg="lige">${valgt === "lige" ? T.ligeValgt : T.lige}</button>`;
    el.querySelectorAll("[data-afspil-ab]").forEach(b => b.onclick = () =>
      afspilKlip(b.dataset.afspilAb, { ...p[b.dataset.afspilAb], klip: p.klip_sek }));
    el.querySelectorAll("[data-valg]").forEach(b => b.onclick = () => {
      abStop();  // stilhed, til man selv trykker afspil i næste spørgsmål
      tilstand.ab[p.id] = b.dataset.valg; gem(); opdaterSendKnap(); autoGem();
      abTegn(o, el, mobil, efter);  // vis valget et øjeblik …
      efter();                      // … og gå videre til næste ufærdige opgave
    });
    abOpdater();
  }
  window.fmdAB = { valgt: o => tilstand.ab[o.ab.id] || null, tegn: abTegn, stop: abStop };

  // Slutskærm, når alt i pakken er besvaret: siger tydeligt, at intet skal sendes – eller, hvis nettet svigter,
  // at det sendes næste gang
  function sjekFaerdig() {
    const { klar, alle } = antal();
    if (!D.web || !alle || klar < alle || tilstand.takVist || document.getElementById("tak")) return;
    tilstand.takVist = true; gem(); abStop();
    const T = abT(), v = document.createElement("div");
    v.id = "tak";
    v.innerHTML = `<div class="kort"><div class="m-flueben">✓</div><h2>${T.tak}</h2><p>${T.tak2}</p>
      <button class="knap" id="takLuk">${T.luk}</button></div>`;
    v.querySelector("#takLuk").onclick = () => v.remove();
    document.body.appendChild(v);
    post(true).catch(() => {
      const en = tilstand.sprog === "en";
      v.querySelector("h2").textContent = en ? "Saved in your browser" : "Gemt i browseren";
      v.querySelector("p").textContent = en ? "We couldn't reach Frankly right now. It will be sent automatically next time you open the test."
        : "Vi kunne ikke nå Frankly lige nu. Det sendes automatisk, næste gang du åbner testen.";
    });
  }
  window.fmdFaerdig = sjekFaerdig;
  window.fmdWeb = !!D.web;  // mobilvisningen bruger det til at vise "gemmes automatisk" i stedet for "send"

  document.addEventListener("DOMContentLoaded", () => {
    const gammel = document.getElementById("visResultat");
    const b = document.createElement("button");
    b.className = "knap"; b.id = "sendResultat"; b.onclick = send;
    gammel.replaceWith(b); opdaterSendKnap();
    document.querySelector("header h1")?.insertAdjacentHTML("beforebegin",
      `<img src="${D.ikon}" alt="" width="40" height="40" style="margin-right:4px">`);
    if (D.web) document.querySelector(".fremdrift")?.insertAdjacentHTML("beforeend",
      ' <small id="gemStatus" style="color:var(--godt)"></small>');
    if (tilstand.tester) { visTester(); forudfyld(); tjekBeskeder(); } else velkomst();
    if (D.web && D.kode && !tilstand.tester) { const f = document.getElementById("velkomstNavn"); if (f) f.value = D.kode; }
  });
})();
</script>
</head>
<body>
<header>
  <div>
    <h1>Model-dyst</h1>
    <div class="under">Lyt og giv karakter – du ved ikke, hvilken model der fandt hvad.</div>
  </div>
  <div class="fremdrift"><div class="bjaelke"><i id="bjaelke"></i></div><small id="fremdrift">Indlæser …</small></div>
  <button class="knap primaer" id="visResultat">Resultat</button>
</header>
<main>
  <nav id="liste" aria-label="Opgaver"></nav>
  <section id="indhold"><p class="tom">Indlæser …</p></section>
</main>

<script>
const TYPER = { kort: "Kort søgning", scene: "Scene", dansk: "Dansk", uden: "Uden …", brief: "Brief",
                vokal: "Vokal", lignende: "Find lignende", ab: "Sammenligning", skaev: "Skæv", stemning: "Stemning",
                reference: "Reference", tempo: "Tempo", brug: "Brug", genre: "Genre" };
let KAR = [["godt", "Godt", 2], ["delvist", "Delvist", 1], ["nej", "Nej", 0]];  // serveren sender testens skala
const IKON_AFSPIL = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
const IKON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';

let opgaver = [], bed = {}, aktiv = 0, fokus = 0, spillerId = null, visning = "opgave";
let ORD = "Model", ORD_LILLE = "model", SPOERGSMAAL = "";  // spørgsmål over karakterknapperne (blindtest)
const lydUrl = {};  // nummer-id → lydfil (blindtesten afspiller fra hjemmesidens filer)
const lyd = new Audio();
lyd.preload = "auto";
let autoNaeste = true;
try { autoNaeste = localStorage.getItem("dyst.autoNaeste") !== "0"; } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const tid = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pynt(titel) {
  const m = titel.match(/^(FMD-\d{5}-\d{2})[_ -]*(.*)$/);
  const tekst = (m ? m[2] : titel).replace(/_/g, " ").replace(/\s+/g, " ").trim();
  return (m ? `<span class="kode">${m[1]}</span>` : "") + esc(tekst || titel);
}

function karakter(oid, nid) { return bed[oid]?.[nid]?.karakter || null; }
function karakterNavn(k) { return (KAR.find(x => x[0] === k) || [, ""])[1]; }
// A/B-sammenligninger (Filmskaber 01) står i listen på lige fod med søgningerne (Steffen 2026-10-27).
// Webudgaven lægger dem ind som opgaver af typen "ab" og tegner/gemmer dem selv (window.fmdAB); én opgave = ét svar.
const erAB = o => o.type === "ab";
function iAlt(o) { return erAB(o) ? 1 : o.numre.length; }
function antalBedoemt(o) { return erAB(o) ? (window.fmdAB?.valgt(o) ? 1 : 0) : o.numre.filter(n => karakter(o.id, n.id)).length; }
function ordet() { return opgaver.some(erAB) ? ["Opgave", "opgaver", "svar"] : ["Søgning", "søgninger", "numre bedømt"]; }

async function hent() {
  const d = await (await fetch("/api/opgaver")).json();
  opgaver = d.opgaver; bed = d.bedoemmelser || {};
  ORD = d.ord || "Model"; ORD_LILLE = d.ord_lille || "model";
  if (d.skala) KAR = d.skala;
  SPOERGSMAAL = d.spoergsmaal || "";
  if (d.navn) { document.title = d.navn; $("h1").textContent = d.navn; }
  $(".under").textContent = `Lyt og giv karakter – du ved ikke, ${ORD_LILLE === "system" ? "hvilket" : "hvilken"} ${ORD_LILLE} der fandt hvad.`;
  for (const o of opgaver) { if (o.reference?.lyd) lydUrl[o.reference.id] = o.reference.lyd;
                             for (const n of o.numre) if (n.lyd) lydUrl[n.id] = n.lyd; }
  if (!opgaver.length) {
    $("#indhold").innerHTML = '<p class="tom">Ingen opgaver endnu. Kør scripts/dyst_saml.py, når modellerne er færdige.</p>';
    $("#fremdrift").textContent = "";
    return;
  }
  aktiv = Math.max(0, opgaver.findIndex(o => antalBedoemt(o) < iAlt(o)));
  if (mobil) fokus = foersteManglende(aktiv);
  tegnListe(); tegnOpgave();
}

function tegnFremdrift() {
  const i_alt = opgaver.reduce((s, o) => s + iAlt(o), 0);
  const klar = opgaver.reduce((s, o) => s + antalBedoemt(o), 0);
  const faerdige = opgaver.filter(o => antalBedoemt(o) === iAlt(o)).length;
  $("#bjaelke").style.width = (i_alt ? 100 * klar / i_alt : 0) + "%";
  $("#fremdrift").innerHTML = `${faerdige} af ${opgaver.length} ${ordet()[1]} færdige · ${klar} af ${i_alt} ${ordet()[2]}` +
    (klar && klar < i_alt ? ` · <a id="manglende">gå til næste manglende (${i_alt - klar})</a>` : "");
}

// ---- Mobil som en app: ét nummer ad gangen (smalle skærme; computeren bruger listen herunder) ----
const MOBIL = matchMedia("(max-width: 760px)");
let mobil = MOBIL.matches, mFaerdig = false;
document.documentElement.classList.toggle("mobil", mobil);
MOBIL.addEventListener("change", () => {
  mobil = MOBIL.matches; document.documentElement.classList.toggle("mobil", mobil);
  if (opgaver.length && visning === "opgave") tegnOpgave();
});
const IKON = {
  tilbage: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  luk: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
function foersteManglende(j) { const o = opgaver[j]; return Math.max(0, o.numre.findIndex(n => !karakter(o.id, n.id))); }
function naesteUfaerdige() {  // næste søgning med numre uden karakter, regnet fra den aktive og rundt
  for (let d = 1; d <= opgaver.length; d++) {
    const j = (aktiv + d) % opgaver.length;
    if (antalBedoemt(opgaver[j]) < iAlt(opgaver[j])) return j;
  }
  return -1;
}
function samletFremdrift() {
  const i_alt = opgaver.reduce((s, o) => s + iAlt(o), 0), klar = opgaver.reduce((s, o) => s + antalBedoemt(o), 0);
  return { i_alt, klar, pct: i_alt ? 100 * klar / i_alt : 0, faerdige: opgaver.filter(o => antalBedoemt(o) === iAlt(o)).length };
}

// Efter et A/B-valg: videre til næste ufærdige opgave – eller slutskærmen, når alt er besvaret
function efterAB() {
  tegnListe();
  const j = naesteUfaerdige();
  setTimeout(() => { if (j >= 0) gaaTil(j); else window.fmdFaerdig?.(); }, 650);
}

function tegnMobil() {
  const o = opgaver[aktiv], f = samletFremdrift(), alle = iAlt(o), [Ord, ord] = ordet();
  const top = `<div class="m-bjaelke"><i style="width:${f.pct}%"></i></div>
    <div class="m-linje"><button class="m-ikon" data-gaa="-1" aria-label="Forrige" ${aktiv === 0 ? "disabled" : ""}>${IKON.tilbage}</button>
      <span>${Ord} ${aktiv + 1} af ${opgaver.length}</span>
      <button class="m-ikon" id="m-menu" aria-label="Menu">${IKON.menu}</button></div>`;
  if (erAB(o)) {
    $("#indhold").innerHTML = `<div class="m-app">${top}<div class="m-ab" id="ab-flade"></div></div>${menuHtml()}`;
    window.fmdAB?.tegn(o, $("#ab-flade"), true, efterAB);
    return;
  }
  if (mFaerdig) {
    const j = naesteUfaerdige();
    $("#indhold").innerHTML = `<div class="m-app">${top}
      <div class="m-faerdig"><div class="m-flueben">✓</div><h2>${Ord} ${aktiv + 1} færdig</h2>
        <div class="m-tael">${alle} af ${alle} numre bedømt${opgaver.length && window.FMD_DATA?.web ? " · gemt hos Frankly" : ""}</div>
        <div class="bjaelke"><i style="width:${f.pct}%"></i></div>
        <div class="m-tael">${f.faerdige} af ${opgaver.length} ${ord}</div>
        <p class="m-tael" id="m-pausetekst" hidden>Dine karakterer er gemt. Luk bare siden – du fortsætter her, når du åbner linket igen.</p></div>
      <div class="m-knapper">${j >= 0 ? `<button class="knap primaer" id="m-naeste">Næste ${ord === "opgaver" ? "opgave" : "søgning"}</button>
        <button class="knap" id="m-pause">Hold pause</button>` :
        (window.fmdWeb ? `<p class="m-tael">Alt er bedømt og gemt hos Frankly ✓ Du behøver ikke sende noget.</p>`
          : `<button class="knap primaer" id="m-send">Alt er bedømt – send resultatet</button>`)}
        <button class="knap" id="m-igen">Se numrene igen</button></div></div>${menuHtml()}`;
    return;
  }
  const n = o.numre[fokus], k = karakter(o.id, n.id);
  const ref = o.reference ? `<div class="reference">
      <button class="afspil" data-afspil="ref" aria-label="Afspil reference">${IKON_AFSPIL}</button>
      <div><div class="info">Reference${o.reference.slut ? ` · udsnit ${tid(o.reference.start)}–${tid(o.reference.slut)}` : ""}</div>
      <div class="titel">${pynt(o.reference.titel)}</div></div>
      <canvas class="boelge" data-boelge-id="${o.reference.id}" data-varighed="${o.reference.varighed || 0}"
        data-udsnit="${o.reference.slut ? `${o.reference.start},${o.reference.slut}` : ""}"></canvas></div>` : "";
  $("#indhold").innerHTML = `<div class="m-app">${top}
    <div class="m-soeg"><div class="m-etiket">${o.reference ? "Find musik der ligner" : "Kunden søgte efter"}</div>
      <p class="kunde">“${esc(o.kunde)}”</p>${ref}</div>
    <div class="m-midte">
      <div class="m-tael">Nummer ${fokus + 1} af ${alle}</div>
      <div class="m-prikker">${o.numre.map((m, j) => `<button data-mfokus="${j}" aria-label="Nummer ${j + 1}"
        class="${j === fokus ? "nu" : ""}" ${karakter(o.id, m.id) ? `data-kk="${karakter(o.id, m.id)}"` : ""}><i></i></button>`).join("")}</div>
      <div class="m-titel">${pynt(n.titel)}</div>
      <div class="m-kunstner">${esc(n.kilde)} · ${tid(n.varighed)}</div>
      <button class="m-afspil" id="m-afspil" data-afspil="${fokus}" aria-label="Afspil">${IKON_AFSPIL}</button>
      <canvas class="boelge" data-boelge-id="${n.id}" data-i="${fokus}" data-varighed="${n.varighed || 0}"></canvas>
      <div class="m-tider"><button class="m-lille" data-frastart="${fokus}">Fra starten</button>
        <button class="m-lille" data-frem="${fokus}">+30 sek.</button></div>
      ${k ? `<span class="m-valgt" data-k="${k}">${karakterNavn(k)}</span>` : ""}
    </div>
    ${SPOERGSMAAL ? `<div class="m-spoerg">${o.reference ? "Matcher nummeret referencen?" : SPOERGSMAAL}</div>` : ""}
    <div class="m-bund">${KAR.map(([kk, t]) =>
      `<button data-k="${kk}" data-i="${fokus}" aria-pressed="${k === kk}">${t}</button>`).join("")}</div>
  </div>${menuHtml()}`;
  opdaterSpiller();
  document.querySelectorAll("canvas.boelge").forEach(c => hentBoelge(c.dataset.boelgeId).then(() => tegnBoelge(c)));
}

function menuHtml() {
  return `<div class="m-menu" id="m-menuflade">
    <div class="m-linje"><span style="padding-left:12px">Menu</span><button class="m-ikon" id="m-luk" aria-label="Luk">${IKON.luk}</button></div>
    ${window.fmdWeb ? `<p>Dine svar gemmes automatisk hos Frankly – du behøver ikke sende noget.</p>
      <button class="knap" id="m-send">Afslut testen</button>`
      : `<button class="knap primaer" id="m-send">Send resultatet til Frankly</button>`}
    ${window.fmdSkiftNavn ? `<button class="knap" id="m-skift">Skift navn</button>` : ""}
    <h3>${ordet()[0] === "Opgave" ? "Opgaver" : "Søgninger"}</h3>
    ${opgaver.map((x, j) => { const mangler = iAlt(x) - antalBedoemt(x);
      return `<button class="m-punkt ${j === aktiv ? "nu" : ""} ${mangler ? "" : "faerdig"}" data-gaatil="${j}">
        <span>${j + 1}. ${erAB(x) ? `${TYPER.ab}: ` : ""}${esc(x.kunde.slice(0, 60))}</span><small>${mangler ? (erAB(x) ? "mangler" : `${mangler} mangler`) : "✓"}</small></button>`; }).join("")}
    <h3>Sådan virker det</h3>
    <p>Lyt til hvert nummer, og bedøm, hvor godt det passer til søgningen – ikke om du selv kan lide det.
      Et godt nummer i den forkerte stemning får ${KAR.at(-1)[1]}. Tryk i waveformen for at lytte et andet sted.</p>
    <p>Dine karakterer gemmes løbende, så du kan holde pause og komme tilbage.</p></div>`;
}

function tegnListe() {
  $("#liste").innerHTML = opgaver.map((o, i) => {
    const n = antalBedoemt(o), alle = iAlt(o);
    const status = n === alle ? "faerdig" : n > 0 ? "i-gang" : "ikke-startet";
    return `<button class="${i === aktiv && visning === "opgave" ? "valgt" : ""} ${status}" data-i="${i}">
      <span class="type">${TYPER[o.type] || o.type}${o.type !== "lignende" && o.sprog ? ` · ${o.sprog === "da" ? "DK" : "ENG"}` : ""}</span>
      <span class="navn">${esc(o.kunde)}</span><span class="tal">${n === alle ? "✓" : erAB(o) ? "mangler" : `${alle - n} mangler`}</span></button>`;
  }).join("");
  tegnFremdrift();
  // Listen til venstre følger med: den aktive søgning rulles ind i midten af listen
  const nav = $("#liste"), valgt = nav.querySelector(".valgt");
  if (valgt && nav.scrollHeight > nav.clientHeight) {
    const top = valgt.getBoundingClientRect().top - nav.getBoundingClientRect().top + nav.scrollTop;
    nav.scrollTop = Math.max(0, top - nav.clientHeight / 2 + valgt.offsetHeight / 2);
  }
}

function tegnOpgave() {
  visning = "opgave";
  if (mobil) return tegnMobil();
  const o = opgaver[aktiv];
  if (erAB(o)) {
    $("#indhold").innerHTML = `<div id="ab-flade"></div>
      <div class="bund"><button class="knap" id="forrige" ${aktiv === 0 ? "disabled" : ""}>← Forrige</button>
        <button class="knap" id="naeste" ${aktiv === opgaver.length - 1 ? "disabled" : ""}>Næste →</button></div>`;
    window.fmdAB?.tegn(o, $("#ab-flade"), false, efterAB);
    return;
  }
  const ref = o.reference ? `<div class="reference">
      <button class="afspil" data-afspil="ref" aria-label="Afspil reference">${IKON_AFSPIL}</button>
      <div><div class="info">Reference${o.reference.slut ? ` · udsnit ${tid(o.reference.start)}–${tid(o.reference.slut)}` : ""}</div>
      <div class="titel">${pynt(o.reference.titel)}</div><div class="info">${esc(o.reference.kilde)}</div></div>
      <canvas class="boelge" data-boelge-id="${o.reference.id}" data-varighed="${o.reference.varighed || 0}"
        data-udsnit="${o.reference.slut ? `${o.reference.start},${o.reference.slut}` : ""}"></canvas></div>` : "";
  $("#indhold").innerHTML = `
    <div class="prompt">
    <span class="chip">${TYPER[o.type] || o.type}</span>
    ${o.type !== "lignende" && o.sprog ? `<span class="chip sprog-${o.sprog}">${o.sprog === "da" ? "Dansk" : "Engelsk"}</span>
      <span class="info">&nbsp;kunden skrev på ${o.sprog === "da" ? "dansk" : "engelsk"}</span>` : ""}
    <p class="kunde">“${esc(o.kunde)}”</p>
    ${o.beskrivelse ? `<p class="motor">Motoren søgte efter: <i>${esc(o.beskrivelse)}</i></p>` : ""}
    ${ref}
    </div>
    <p class="vejledning">${SPOERGSMAAL && !o.reference ? `<span class="spoerg">${SPOERGSMAAL}</span>` : `Passer nummeret til ${o.reference ? "referencen" : "søgningen"}?`} <b>Bedøm hvor godt det matcher – ikke om du selv kan lide det.</b> ${o.vejledning || "Det afspilles fra det sted, motoren fandt."}</p>
    ${o.numre.map((n, i) => `
      <div class="raekke ${i === fokus ? "fokus" : ""}" data-i="${i}" data-id="${n.id}"
           ${karakter(o.id, n.id) ? `data-k="${karakter(o.id, n.id)}"` : ""}>
        <span class="nr">${karakter(o.id, n.id) ? "✓" : i + 1}</span>
        <button class="afspil" data-afspil="${i}" aria-label="Afspil">${IKON_AFSPIL}</button>
        <div><div class="titel">${pynt(n.titel)}<span class="valgt-karakter">${karakterNavn(karakter(o.id, n.id))}</span><span class="mangler-maerke">mangler karakter</span></div>
          <div class="info">${esc(n.kilde)} · ${tid(n.varighed)} ·${o.skjulStart ? "" : ` lytter fra ${tid(n.start)} ·`}
            <a data-fraStart="${i}">fra starten</a> · <a data-frem="${i}">+30 sek.</a></div></div>
        <div class="karakter">${KAR.map(([k, t]) =>
          `<button data-k="${k}" data-i="${i}" aria-pressed="${karakter(o.id, n.id) === k}">${t}</button>`).join("")}</div>
        <canvas class="boelge" data-boelge-id="${n.id}" data-i="${i}" data-varighed="${n.varighed || 0}"></canvas>
        <div class="forloeb"></div>
      </div>`).join("")}
    <div class="bund">
      <button class="knap" id="forrige" ${aktiv === 0 ? "disabled" : ""}>← Forrige</button>
      <button class="knap" id="naeste" ${aktiv === opgaver.length - 1 ? "disabled" : ""}>Næste →</button>
      <label><input type="checkbox" id="auto" ${autoNaeste ? "checked" : ""}> Afspil næste nummer, når jeg har givet karakter</label>
    </div>
    <p class="taster"><kbd>Mellemrum</kbd> afspil/pause · ${KAR.map(([k, t], i) => `<kbd>${i + 1}</kbd> ${t}`).join(" · ")} ·
      <kbd>F</kbd> +30 sek. · <kbd>↑</kbd><kbd>↓</kbd> skift nummer · <kbd>←</kbd><kbd>→</kbd> skift søgning</p>`;
  opdaterSpiller();
  document.querySelectorAll("canvas.boelge").forEach(c => hentBoelge(c.dataset.boelgeId).then(() => tegnBoelge(c)));
}

// ---- Waveform: hjemmesidens egne bølgeformer (via /api/boelge), viser hvor man er, klik = start dér ----
const boelger = {};  // nummer-id → Promise<{streger, sek} | null>
function hentBoelge(id) {
  return boelger[id] ||= fetch(`/api/boelge/${id}`).then(r => r.ok ? r.json() : null).catch(() => null);
}
function farve(navn) { return getComputedStyle(document.documentElement).getPropertyValue(navn).trim(); }

async function tegnBoelge(c) {
  const b = await hentBoelge(c.dataset.boelgeId);
  const raekke = c.closest(".raekke");
  if (!b || !b.streger.length) { c.style.display = "none"; return; }
  raekke?.classList.add("har-boelge");
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const varighed = +c.dataset.varighed || b.sek;
  const spiller = spillerId === c.dataset.boelgeId && lyd.duration;
  const pos = spiller ? lyd.currentTime / lyd.duration : -1;
  if (c.dataset.udsnit) {  // referencens udsnit skraveres
    const [a, s] = c.dataset.udsnit.split(",").map(Number);
    g.globalAlpha = .28; g.fillStyle = farve("--accent");
    g.fillRect(w * a / varighed, 0, w * (s - a) / varighed, h);
    g.globalAlpha = 1;
  }
  const bredde = 3, antal = Math.floor(w / bredde);
  const svag = farve("--svag"), spillet = farve("--accent"), mid = h / 2;
  g.globalAlpha = .75;
  for (let k = 0; k < antal; k++) {
    const v = b.streger[Math.floor(k * b.streger.length / antal)] || 0;
    const hoejde = Math.max(1, v * (h - 2));
    g.fillStyle = pos >= 0 && k / antal <= pos ? spillet : svag;
    g.fillRect(k * bredde, mid - hoejde / 2, bredde - 1, hoejde);
  }
  g.globalAlpha = 1;
  if (pos >= 0) { g.fillStyle = farve("--tekst"); g.fillRect(Math.round(w * pos) - 1, 0, 2, h); }
  const hover = c.dataset.hover;
  if (hover !== undefined && hover !== "") {
    const x = +hover;
    g.fillStyle = farve("--svag"); g.fillRect(x, 0, 1, h);
    g.font = "11px -apple-system, sans-serif"; g.fillStyle = farve("--tekst");
    const t = tid(varighed * x / w);
    g.fillText(t, Math.min(x + 4, w - g.measureText(t).width - 2), 11);
  }
}

function tegnSpillende() {
  document.querySelectorAll(`canvas.boelge[data-boelge-id="${spillerId}"]`).forEach(tegnBoelge);
}
(function loekke() { if (!lyd.paused) tegnSpillende(); requestAnimationFrame(loekke); })();
window.addEventListener("resize", () => document.querySelectorAll("canvas.boelge").forEach(tegnBoelge));

document.addEventListener("mousemove", e => {
  const c = e.target.closest?.("canvas.boelge");
  document.querySelectorAll("canvas.boelge[data-hover]").forEach(x => {
    if (x !== c) { delete x.dataset.hover; tegnBoelge(x); }
  });
  if (c) { c.dataset.hover = e.clientX - c.getBoundingClientRect().left; tegnBoelge(c); }
});

let venterStart = null;  // hvor det nye nummer skal starte, når browseren kender dets længde
lyd.addEventListener("loadedmetadata", () => {
  if (venterStart === null) return;
  lyd.currentTime = Math.min(venterStart, Math.max(0, lyd.duration - 1));
  venterStart = null;
  lyd.play();
});

function afspil(id, start) {
  if (spillerId === id && !lyd.paused) { lyd.pause(); opdaterSpiller(); return; }
  if (spillerId !== id) {
    spillerId = id;
    venterStart = start || 0;
    lyd.src = lydUrl[id] || `/api/lyd/${id}`;
  } else {
    lyd.play();
  }
  opdaterSpiller();
}

function frem(n) {  // spring 30 sek. frem i nummeret (starter det, hvis det ikke spiller)
  if (spillerId !== n.id) return afspil(n.id, (n.start || 0) + 30);
  lyd.currentTime = Math.min(lyd.currentTime + 30, Math.max(0, (lyd.duration || 0) - 1));
  if (lyd.paused) lyd.play();
}

function opdaterSpiller() {
  document.querySelectorAll(".raekke").forEach(r => {
    const spiller = r.dataset.id === spillerId && !lyd.paused;
    r.classList.toggle("spiller", r.dataset.id === spillerId);
    $(".afspil", r).innerHTML = spiller ? IKON_PAUSE : IKON_AFSPIL;
  });
  const o = opgaver[aktiv], refKnap = $('[data-afspil="ref"]');
  if (refKnap && o.reference) refKnap.innerHTML = (spillerId === o.reference.id && !lyd.paused) ? IKON_PAUSE : IKON_AFSPIL;
  const mKnap = $("#m-afspil");
  if (mKnap) mKnap.innerHTML = (spillerId === o.numre[fokus]?.id && !lyd.paused) ? IKON_PAUSE : IKON_AFSPIL;
}

lyd.addEventListener("timeupdate", () => {
  const r = document.querySelector(`.raekke[data-id="${spillerId}"] .forloeb`);
  if (r && lyd.duration) r.style.width = (100 * lyd.currentTime / lyd.duration) + "%";
});
["play", "pause", "ended"].forEach(e => lyd.addEventListener(e, opdaterSpiller));

async function giv(i, k) {
  const o = opgaver[aktiv], n = o.numre[i];
  const ny = karakter(o.id, n.id) === k ? null : k;  // klik igen = fortryd
  if (ny) (bed[o.id] ||= {})[n.id] = { karakter: ny }; else delete bed[o.id]?.[n.id];
  if (mobil) return givMobil(o, n, i, ny);
  document.querySelectorAll(`.raekke[data-i="${i}"] .karakter button`).forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.k === ny));
  const raekke = document.querySelector(`.raekke[data-i="${i}"]`);
  if (ny) raekke.dataset.k = ny; else delete raekke.dataset.k;
  $(".nr", raekke).textContent = ny ? "✓" : i + 1;
  $(".valgt-karakter", raekke).textContent = karakterNavn(ny);
  tegnListe();
  fetch("/api/bedoem", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ opgave: o.id, nummer: n.id, karakter: ny }) })
    .catch(() => alert("Karakteren blev ikke gemt – kører fmd-dyst stadig?"));
  if (ny && autoNaeste) {
    const naeste = o.numre.findIndex((m, j) => j > i && !karakter(o.id, m.id));
    if (naeste >= 0) { saetFokus(naeste); afspil(o.numre[naeste].id, o.numre[naeste].start); }
    else lyd.pause();
  }
}

// Mobil: gem karakteren, gå videre til næste nummer uden karakter – eller vis "Søgning færdig"
function givMobil(o, n, i, ny) {
  tegnListe();
  fetch("/api/bedoem", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ opgave: o.id, nummer: n.id, karakter: ny }) }).catch(() => {});
  if (!ny) return tegnMobil();
  const naeste = [...o.numre.keys()].map(d => (i + 1 + d) % o.numre.length).find(j => !karakter(o.id, o.numre[j].id));
  if (naeste === undefined) { lyd.pause(); mFaerdig = true; return tegnMobil(); }
  fokus = naeste; spillerId = null; tegnMobil();
  afspil(o.numre[naeste].id, o.numre[naeste].start);
}

function saetFokus(i) {
  if (mobil) {
    const ny = Math.max(0, Math.min(i, opgaver[aktiv].numre.length - 1));
    if (ny !== fokus) { fokus = ny; tegnMobil(); }
    return;
  }
  fokus = Math.max(0, Math.min(i, opgaver[aktiv].numre.length - 1));
  document.querySelectorAll(".raekke").forEach(r => r.classList.toggle("fokus", +r.dataset.i === fokus));
  document.querySelector(`.raekke[data-i="${fokus}"]`)?.scrollIntoView({ block: "nearest" });
}

function gaaTil(i) {
  if (i < 0 || i >= opgaver.length) return;
  aktiv = i; fokus = mobil && !erAB(opgaver[i]) ? foersteManglende(i) : 0; mFaerdig = false; lyd.pause(); spillerId = null;
  window.fmdAB?.stop();
  tegnListe(); tegnOpgave(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const c = e.target.closest("canvas.boelge");
  if (c) {  // klik i waveformen: start (eller spring) dertil
    const r = c.getBoundingClientRect(), id = c.dataset.boelgeId;
    const varighed = +c.dataset.varighed || lyd.duration || 0;
    const sek = Math.max(0, varighed * (e.clientX - r.left) / r.width);
    if (c.dataset.i !== undefined) saetFokus(+c.dataset.i);
    if (spillerId === id && lyd.duration) { lyd.currentTime = Math.min(sek, lyd.duration - 0.5); lyd.play(); }
    else { if (spillerId === id) spillerId = null; afspil(id, sek); }
    return;
  }
  const t = e.target.closest("button, a");
  if (!t || t.closest("#ab-flade")) return;  // A/B-knapperne styres af webudgaven selv
  if (t.closest("#liste")) return gaaTil(+t.dataset.i);
  if (t.id === "visResultat") return visResultat(false);
  if (t.id === "manglende") {  // første nummer uden karakter, regnet fra den aktive søgning og rundt
    for (let d = 0; d < opgaver.length; d++) {
      const j = (aktiv + d) % opgaver.length, o = opgaver[j];
      if (erAB(o)) { if (!antalBedoemt(o)) return gaaTil(j); continue; }
      const i = o.numre.findIndex(n => !karakter(o.id, n.id));
      if (i < 0) continue;
      if (j !== aktiv || visning !== "opgave") gaaTil(j);
      saetFokus(i);
      document.querySelector(`.raekke[data-i="${i}"]`)?.scrollIntoView({ block: "center" });
      return;
    }
    return;
  }
  if (t.id === "afsloer") return visResultat(true);
  if (t.id === "tilbage") return gaaTil(aktiv);
  if (t.id === "forrige") return gaaTil(aktiv - 1);
  if (t.id === "naeste") return gaaTil(aktiv + 1);
  if (t.dataset.gaa) return gaaTil(aktiv + +t.dataset.gaa);
  if (t.dataset.mfokus !== undefined) { spillerId = null; lyd.pause(); return saetFokus(+t.dataset.mfokus); }
  if (t.dataset.gaatil !== undefined) return gaaTil(+t.dataset.gaatil);
  if (t.id === "m-menu") return $("#m-menuflade").classList.add("aaben");
  if (t.id === "m-luk") return $("#m-menuflade").classList.remove("aaben");
  if (t.id === "m-send") { $("#m-menuflade")?.classList.remove("aaben"); return ($("#sendResultat") || $("#visResultat"))?.click(); }
  if (t.id === "m-naeste") return gaaTil(naesteUfaerdige());
  if (t.id === "m-skift") return window.fmdSkiftNavn?.();
  if (t.id === "m-pause") { lyd.pause(); $("#m-pausetekst").hidden = false; return; }
  if (t.id === "m-igen") { mFaerdig = false; fokus = 0; return tegnMobil(); }
  const o = opgaver[aktiv];
  if (t.dataset.afspil === "ref") return afspil(o.reference.id, o.reference.start);
  if (t.dataset.afspil !== undefined) { saetFokus(+t.dataset.afspil); const n = o.numre[+t.dataset.afspil]; return afspil(n.id, n.start); }
  if (t.dataset.frastart !== undefined) { const n = o.numre[+t.dataset.frastart]; spillerId = null; saetFokus(+t.dataset.frastart); return afspil(n.id, 0); }
  if (t.dataset.frem !== undefined) { const n = o.numre[+t.dataset.frem]; saetFokus(+t.dataset.frem); return frem(n); }
  if (t.dataset.k) { saetFokus(+t.dataset.i); return giv(+t.dataset.i, t.dataset.k); }
});

document.addEventListener("change", e => {
  if (e.target.id === "auto") {
    autoNaeste = e.target.checked;
    try { localStorage.setItem("dyst.autoNaeste", autoNaeste ? "1" : "0"); } catch (err) {}
  }
});

document.addEventListener("keydown", e => {
  if (visning !== "opgave" || e.metaKey || e.ctrlKey || e.target.matches("input, textarea")) return;
  const o = opgaver[aktiv]; if (!o) return;
  if (erAB(o)) {  // A/B: kun skift opgave med piletasterne (valget træffes med knapperne)
    if (e.key === "ArrowRight") gaaTil(aktiv + 1); else if (e.key === "ArrowLeft") gaaTil(aktiv - 1);
    return;
  }
  const n = o.numre[fokus];
  if (e.key === " ") { e.preventDefault(); afspil(n.id, n.start); }
  else if (/^[1-9]$/.test(e.key) && KAR[+e.key - 1]) giv(fokus, KAR[+e.key - 1][0]);
  else if (e.key === "f" || e.key === "F") frem(n);
  else if (e.key === "ArrowDown") { e.preventDefault(); saetFokus(fokus + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); saetFokus(fokus - 1); }
  else if (e.key === "ArrowRight") gaaTil(aktiv + 1);
  else if (e.key === "ArrowLeft") gaaTil(aktiv - 1);
});

async function visResultat(afsloer) {
  visning = "resultat"; lyd.pause(); tegnListe();
  const r = await (await fetch(`/api/resultat?afsloer=${afsloer}`)).json();
  const typer = [...new Set(r.modeller.flatMap(m => Object.keys(m.typer)))];
  const sprog = [...new Set(r.modeller.flatMap(m => Object.keys(m.sprog || {})))].sort();
  const SPROG = { da: "Dansk", en: "Engelsk" };
  const pct = x => x == null ? "–" : Math.round(100 * x);
  $("#indhold").innerHTML = `
    <span class="chip">Resultat</span>
    <p class="kunde">${r.faerdige} af ${r.i_alt} søgninger er færdigbedømt</p>
    <p class="forklaring">Kun søgninger, hvor alle numre har fået karakter, tæller med.</p>
    ${r.faerdige ? `<table>
      <tr><th>${ORD}</th>${afsloer ? "<th>Navn</th>" : ""}<th>Samlet score</th><th>${KAR[0][1]} i top 5</th><th>Brugbare i top 5</th>
        ${typer.map(t => `<th>${TYPER[t] || t}</th>`).join("")}</tr>
      ${r.modeller.map(m => `<tr><td>${m.etiket}</td>${afsloer ? `<td><b>${esc(m.model)}</b></td>` : ""}
        <td class="stor">${pct(m.ndcg)}</td><td class="stor">${m.top == null ? "–" : m.top.toFixed(1)}</td>
        <td>${m.traef == null ? "–" : m.traef.toFixed(1)} af 5</td>
        ${typer.map(t => `<td>${pct(m.typer[t])}</td>`).join("")}</tr>`).join("")}
    </table>
    ${sprog.length ? `<h3>Tekstsøgninger efter sprog</h3>
    <table>
      <tr><th>${ORD}</th>${afsloer ? "<th>Navn</th>" : ""}${sprog.map(s => `<th>${SPROG[s] || s}</th>`).join("")}</tr>
      ${r.modeller.map(m => `<tr><td>${m.etiket}</td>${afsloer ? `<td><b>${esc(m.model)}</b></td>` : ""}
        ${sprog.map(s => `<td class="stor">${pct(m.sprog[s])}<small class="info"> · ${m.sprog_antal[s] || 0} søgn.</small></td>`).join("")}</tr>`).join("")}
    </table>
    <p class="forklaring">Kun tekstsøgninger ("Find lignende" har ingen tekst). Sproget er det, kunden skrev på.
      AIMS får kundens tekst direkte; vores motor får en engelsk lydbeskrivelse (i stedet for det kommende sproglag).</p>` : ""}
    <p class="forklaring">Samlet score (0–100): hvor tæt ${ORD_LILLE}ens top 5 kommer på den bedst mulige top 5 blandt de numre,
      du har bedømt for søgningen (nDCG@5; ${KAR.filter(x => x[2] > 0).map(([k, t, p]) => `${t} = ${p}`).join(", ")} point). ${KAR[0][1]} i top 5 = hvor mange af ${ORD_LILLE}ens
      5 første numre du gav ${KAR[0][1]}. Brugbare = hvor mange du gav ${KAR.filter(x => x[2] > 0).map(x => x[1]).join(", ").replace(/, ([^,]*)$/, " eller $1")}.</p>` : ""}
    <div class="bund">
      <button class="knap" id="tilbage">← Tilbage til bedømmelsen</button>
      ${afsloer || !r.faerdige ? "" : `<button class="knap primaer" id="afsloer">Afslør hvilket ${ORD_LILLE} der er hvilket</button>`}
    </div>`;
}

// Den faste søgetekst står lige under toppen; rækker, der rulles frem, må ikke gemme sig bag den.
const maal = new ResizeObserver(() => {
  // på mobil står toppen ikke fast – så er det kun søgeteksten, der skal holdes fri
  const h = getComputedStyle($("header")).position === "sticky" ? $("header").offsetHeight : 0;
  const p = $(".prompt")?.offsetHeight || 0;
  document.documentElement.style.setProperty("--hoved", h + "px");
  document.documentElement.style.setProperty("--fast", (h + p + 8) + "px");
});
maal.observe($("header"));
new MutationObserver(() => { const p = $(".prompt"); if (p) maal.observe(p); }).observe($("#indhold"), { childList: true });

hent();
</script>
</body>
</html>
