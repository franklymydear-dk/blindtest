<script>
// Instrumenttesten (Steffen 2026-10-29): ét nummer ad gangen, "Hvilke instrumenter er med?" med ca. 8 klogt valgte
// muligheder (ja/nej) + sang. Hvem der har foreslået hvad (AIMS, vores tags-motor, lydmodellen alene), står IKKE i siden.
// Data: window.INSTR = {runde, gem, numre: [{id, titel, kunstner, varighed, lyd, start, pakke, muligheder: [kode]}],
// instrumenter: {kode: [navn, forklaring]}, boelger}. Svar gemmes i browseren og sendes som "karakterer" til gem.php:
// opgave = "i"+kode (ja → praecis, nej → nej), sang = opgave "vsang" (ingen → nej, kvinde → praecis, mand → godt, begge → delvist).
const W = window.INSTR;
const SANG = [["ingen", "Ingen sang"], ["kvinde", "Kvinde"], ["mand", "Mand"], ["begge", "Begge"]];
const SANG_KAR = {ingen: "nej", kvinde: "praecis", mand: "godt", begge: "delvist"};
let navn = "", pakke = "", numre = [], svar = {}, aktiv = 0, sendtOk = true, sender = false, igen = false;
const lyd = new Audio(); lyd.preload = "auto";
const boelger = W.boelger || {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const tid = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const N = k => `fmd-${W.runde}:${k}`;
function laes(k) { try { return JSON.parse(localStorage.getItem(k) ?? "null"); } catch (e) { return null; } }
function husk(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// To pakker: A (Steffen) og B (Thomas) + fælles numre til begge. Andre navne fordeles efter navnet; ?pakke=A|B|alle vinder.
function vaelgPakke(n) {
  const p = new URLSearchParams(location.search).get("pakke");
  if (p) return p.toUpperCase() === "ALLE" ? "alle" : p.toUpperCase();
  const l = n.toLowerCase();
  if (l.includes("thomas")) return "B";
  if (l.includes("steffen")) return "A";
  let h = 0; for (const c of l) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 2 ? "B" : "A";
}
const faerdig = n => { const s = svar[n.id]; return !!s && !!s.sang && n.muligheder.every(k => s[k]); };
const antalSvar = () => numre.reduce((a, n) => a + n.muligheder.filter(k => svar[n.id]?.[k]).length + (svar[n.id]?.sang ? 1 : 0), 0);
const iAlt = () => numre.reduce((a, n) => a + n.muligheder.length + 1, 0);

function somKarakterer() {
  const b = {};
  for (const [id, s] of Object.entries(svar)) {
    const t = s.tid || "";
    for (const [k, v] of Object.entries(s)) {
      if (k === "sang" && SANG_KAR[v]) (b.vsang ||= {})[id] = {karakter: SANG_KAR[v], tid: t};
      else if (W.instrumenter[k] && (v === "ja" || v === "nej")) (b["i" + k] ||= {})[id] = {karakter: v === "ja" ? "praecis" : "nej", tid: t};
    }
  }
  return b;
}
async function sendAlt() {
  if (sender) { igen = true; return; }
  sender = true;
  const enhed = matchMedia("(pointer: coarse)").matches ? "mobil" : "computer";
  do {
    igen = false;
    try {
      const r = await fetch(W.gem, {method: "POST", headers: {"Content-Type": "text/plain"}, body: JSON.stringify({
        runde: W.runde, tester: navn, test: "Instrumenttest", udgave: "pakke " + pakke, version: W.runde, enhed,
        i_alt: iAlt(), endelig: numre.every(faerdig), bedoemmelser: somKarakterer()})}).then(r => r.json());
      sendtOk = !!r?.ok;
    } catch (e) { sendtOk = false; }
  } while (igen);
  sender = false;
  const g = document.getElementById("gemt");
  if (g) g.textContent = sendtOk ? "✓ gemt hos Frankly" : "gemt i browseren – sendes ved næste svar";
}

function start() {
  navn = laes(N("navn")) || "";
  if (!navn) return velkomst();
  pakke = vaelgPakke(navn);
  numre = W.numre.filter(n => pakke === "alle" || n.pakke === "fælles" || n.pakke === pakke);
  svar = laes(N("svar:" + navn)) || {};
  const f = numre.findIndex(n => !faerdig(n));
  aktiv = f < 0 ? 0 : f;
  if (Object.keys(svar).length) sendAlt();
  tegn();
}
function velkomst() {
  lyd.pause();
  document.getElementById("status").textContent = document.getElementById("gemt").textContent = "";
  document.getElementById("skiftnavn").hidden = true;
  const gl = laes("fmd-oerer-oerer-2:navn") || laes("fmd-oerer-oerer-1:navn") || "";
  document.getElementById("main").innerHTML = `
    <div class="kort velkomst">
      <div class="titel">Hvilke instrumenter er med?</div>
      <p>Du hører ca. ${Math.round(W.numre.filter(n => n.pakke !== "B").length)} numre fra Frankly My Dears katalog. Til hvert
        nummer står en kort liste med instrumenter: svar <b>Ja</b> eller <b>Nej</b> til hvert – er det med i nummeret eller ej?
        Og om der er sang. Nogle står der, fordi et system mener, de er med; andre, fordi et system mener, de ikke er.
        Du ved ikke hvilke – svar kun ud fra dine ører.</p>
      <p>Lyt gerne flere steder i nummeret (tryk i bølgen eller "+30 sek."): et instrument tæller som "Ja", hvis det er
        tydeligt med et sted. Ca. 1 minut pr. nummer, gerne med høretelefoner. Du kan holde pause og fortsætte senere
        (brug samme enhed).</p>
      <label for="navn">Dit fulde navn</label>
      <input id="navn" autocomplete="name" enterkeyhint="go" value="${esc(gl)}">
      <button class="knap primaer" id="startknap">Start</button>
    </div>`;
  const felt = document.getElementById("navn");
  const go = () => { const v = felt.value.trim().replace(/\s+/g, " "); if (!v) return felt.focus(); husk(N("navn"), v); start(); };
  document.getElementById("startknap").onclick = go;
  felt.onkeydown = e => { if (e.key === "Enter") go(); };
}
function tak() {
  lyd.pause();
  document.getElementById("main").innerHTML = `<div class="kort velkomst"><div class="titel">Tak!</div>
    <p>Alle ${numre.length} numre er besvaret.${sendtOk ? " Dine svar er gemt hos Frankly – du behøver ikke sende noget, du kan bare lukke siden."
      : " Dine svar er gemt i browseren, men er ikke nået frem til Frankly endnu. Åbn siden igen senere, så sendes de."}</p>
    <button class="knap" id="igen">Se numrene igen</button></div>`;
  document.getElementById("igen").onclick = () => { aktiv = 0; tegn(); };
}
function opdaterTop() {
  document.getElementById("status").textContent = `Nummer ${aktiv + 1} af ${numre.length} · ${numre.filter(faerdig).length} færdige`;
  document.getElementById("bar").style.width = `${100 * antalSvar() / iAlt()}%`;
}
function tegn() {
  const b = document.getElementById("skiftnavn");
  b.hidden = false; b.title = navn;
  b.onclick = () => { husk(N("navn"), ""); velkomst(); };
  const n = numre[aktiv], s = svar[n.id] || {};
  if (lyd.dataset.id !== n.id) { lyd.pause(); lyd.src = n.lyd; lyd.dataset.id = n.id; lyd.currentTime = 0; lyd.dataset.start = n.start; }
  document.getElementById("main").innerHTML = `
    <div class="kort">
      <div class="titel">${esc(n.titel)}</div><div class="info">${esc(n.kunstner)} · ${tid(n.varighed)}</div>
      <canvas id="boelge"></canvas>
      <div class="styring"><button class="knap primaer" id="afspil">▶ Afspil</button>
        <button class="knap" id="frem">+30 sek.</button><span class="svag" id="tid"></span></div>
      <h2>Er instrumentet med i nummeret?</h2>
      <p class="hjaelp">Ja = tydeligt med et sted i nummeret. Nej = ikke med (eller du kan ikke høre det).</p>
      <div class="liste">${n.muligheder.map(k => { const [nv, fk] = W.instrumenter[k]; return `
        <div class="linje ${s[k] || ""}" data-k="${k}"><div class="navn">${esc(nv)}${fk ? ` <small>${esc(fk)}</small>` : ""}</div>
          <div class="jn"><button data-k="${k}" data-v="ja" class="ja ${s[k] === "ja" ? "valgt" : ""}">Ja</button>
          <button data-k="${k}" data-v="nej" class="nej ${s[k] === "nej" ? "valgt" : ""}">Nej</button></div></div>`; }).join("")}</div>
      <h2>Sang</h2>
      <div class="jn" style="flex-wrap:wrap">${SANG.map(([v, t]) => `<button data-k="sang" data-v="${v}" class="ja ${s.sang === v ? "valgt" : ""}">${t}</button>`).join("")}</div>
      <div class="styring" style="margin-top:18px"><button class="knap" id="forrige" ${aktiv ? "" : "disabled"}>← Forrige</button>
        <button class="knap primaer" id="naeste">${aktiv + 1 < numre.length ? "Næste nummer →" : "Færdig"}</button></div>
    </div>`;
  document.getElementById("afspil").onclick = () => {
    if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch (e) {}
    if (lyd.paused) { if (!lyd.currentTime && +lyd.dataset.start) lyd.currentTime = +lyd.dataset.start; lyd.play(); } else lyd.pause();
  };
  document.getElementById("frem").onclick = () => { lyd.currentTime = Math.min(n.varighed - 1, (lyd.currentTime || +n.start) + 30); if (lyd.paused) lyd.play(); };
  document.querySelectorAll(".jn button").forEach(btn => btn.onclick = () => {
    const x = svar[n.id] ||= {};
    const k = btn.dataset.k, v = btn.dataset.v;
    x[k] = x[k] === v ? "" : v;   // samme knap igen = fortryd
    x.tid = new Date().toISOString().slice(0, 19);
    husk(N("svar:" + navn), svar); sendAlt(); tegnValg(); opdaterTop();
  });
  document.getElementById("forrige").onclick = () => { if (aktiv) { aktiv--; tegn(); scrollTo(0, 0); } };
  document.getElementById("naeste").onclick = () => {
    const f = numre.findIndex(x => !faerdig(x));
    if (aktiv + 1 < numre.length) aktiv++;
    else if (f < 0) return tak();
    else aktiv = f;   // sidste nummer, men nogle mangler svar: hop til det første
    tegn(); scrollTo(0, 0);
  };
  const c = document.getElementById("boelge");
  c.onclick = e => { const r = c.getBoundingClientRect(); lyd.currentTime = n.varighed * (e.clientX - r.left) / r.width; if (lyd.paused) lyd.play(); };
  opdaterTop();
}
function tegnValg() {
  const s = svar[numre[aktiv].id] || {};
  document.querySelectorAll(".jn button").forEach(b => b.classList.toggle("valgt", s[b.dataset.k] === b.dataset.v));
  document.querySelectorAll(".linje").forEach(l => { l.classList.toggle("ja", s[l.dataset.k] === "ja"); l.classList.toggle("nej", s[l.dataset.k] === "nej"); });
}
lyd.onplay = lyd.onpause = () => { const b = document.getElementById("afspil"); if (b) b.textContent = lyd.paused ? "▶ Afspil" : "❚❚ Pause"; };
(function loekke() {
  const c = document.getElementById("boelge");
  if (c && numre[aktiv]) {
    const n = numre[aktiv], bo = boelger[n.id];
    const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const p = (lyd.currentTime || 0) / n.varighed;
    if (bo?.streger) {
      const antal = Math.floor(w / 3);
      for (let k = 0; k < antal; k++) {
        const v = bo.streger[Math.floor(k * bo.streger.length / antal)] || 0, hh = Math.max(1, v * h * .8);
        g.fillStyle = k / antal <= p ? "#a8875a" : "rgba(201,196,187,.35)"; g.fillRect(k * 3, h / 2 - hh / 2, 2, hh);
      }
    }
    g.fillStyle = "#fff"; g.fillRect(w * p - 1, 0, 2, h);
    const t = document.getElementById("tid"); if (t) t.textContent = lyd.currentTime ? `${tid(lyd.currentTime)} / ${tid(n.varighed)}` : "";
  }
  requestAnimationFrame(loekke);
})();
start();
</script>
</body>
</html>
