:root {
  color-scheme: dark;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tekst);

button { font: inherit; color: inherit; cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--streg);

main { max-width: 980px; margin: 0 auto; padding: 22px 20px 80px; }
.intro { color: var(--svag); margin: 0 0 16px; }

.titel { font-size: 20px; font-weight: 600; }
.info { color: var(--svag); font-size: 13px; margin-top: 2px; }
.fakta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }

.fakta b { color: var(--tekst); }

.knap.primaer { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.svag { color: var(--svag); }
.spoerg { margin-top: 18px; display: grid; gap: 12px; }
.spoerg .linje { display: grid; grid-template-columns: 280px 1fr; gap: 10px; align-items: center; }
.valg { display: flex; gap: 6px; flex-wrap: wrap; }
.valg button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--streg); background: var(--flade2); font-size: 14px; }
.valg button.valgt { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
textarea { width: 100%; min-height: 50px; background: var(--flade2); border: 1px solid var(--streg); border-radius: 8px;

.forklaring { font-size: 13px; color: var(--svag); display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; }
.forklaring i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.velkomst { max-width: 560px; margin: 24px auto; display: grid; gap: 12px; }
.velkomst p { margin: 0; }
.velkomst input { font: inherit; font-size: 16px; color: inherit; background: var(--flade2); border: 1px solid var(--streg);

.velkomst .knap.primaer { padding: 13px; font-size: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; }

  #naeste { flex: 1; padding: 14px; }

const spoergsmaal = n => SPG.filter(q => !q[4] || q[4](n));
function faerdig(n) { const s = D.svar[n.id]; return s && spoergsmaal(n).every(([k]) => s[k]); }

function velkomst() {
  stop();
  document.getElementById("prikker").innerHTML = "";
  document.getElementById("status").textContent = document.getElementById("gemt").textContent = "";
  document.getElementById("skiftnavn").hidden = true;
  document.getElementById("main").innerHTML = `
    <div class="kort velkomst">
      <div class="titel">${esc(WEB.titel || "Lyt til taktslagene")}</div>
      <p>Du hører ${WEB.numre.length} numre fra Frankly My Dears katalog med <b>klik på de taktslag, vores nye musikmotor har
        fundet</b> og <b style="color:var(--accent)">gule streger</b>, hvor den mener, nummeret skifter del. Til hvert nummer
        svarer du på et par korte spørgsmål – ud fra dine ører. Det tager ca. 15 minutter, gerne med høretelefoner.</p>
      <p class="svag">Du kan holde pause og fortsætte senere, også på en anden enhed: skriv bare det samme navn.</p>
      <label for="navn">Dit fulde navn</label>
      <input id="navn" autocomplete="name" enterkeyhint="go" value="${esc(laes("fmd-oerer-oerer-1:navn") || "")}">
      <button class="knap primaer" id="start">Start</button>
    </div>`;
  const felt = document.getElementById("navn");
  const start = () => {
    const v = felt.value.trim().replace(/\s+/g, " ");
    if (!v) return felt.focus();
    husk(N("navn"), v);
    hent();
  };
  document.getElementById("start").onclick = start;
  felt.onkeydown = e => { if (e.key === "Enter") start(); };
}
function tak() {
  stop();
  document.getElementById("main").innerHTML = `
    <div class="kort velkomst"><div class="titel">Tak!</div>
      <p>Alle ${D.numre.length} numre er besvaret.${!WEB ? "" : sendtOk ? " Dine svar er gemt hos Frankly – du behøver ikke sende noget, du kan bare lukke siden."
        : " Dine svar er gemt i browseren, men er ikke nået frem til Frankly endnu. Åbn siden igen senere, så sendes de."}</p>
      <button class="knap" id="igen">Se numrene igen</button></div>`;
  document.getElementById("igen").onclick = () => { aktiv = 0; tegn(); };
}

function tegn() {
  stop();
  if (WEB) {
    const b = document.getElementById("skiftnavn");
    b.hidden = false; b.title = navn;
    b.onclick = () => { husk(N("navn"), ""); velkomst(); };
  }
  document.getElementById("prikker").innerHTML = D.numre.map((n, i) =>
    `<button class="prik ${faerdig(n) ? "faerdig" : ""} ${i === aktiv ? "aktiv" : ""}" data-i="${i}">${i + 1}</button>`).join("");
  document.querySelectorAll(".prik").forEach(b => b.onclick = () => { aktiv = +b.dataset.i; tegn(); });
  document.getElementById("status").textContent = `${D.numre.filter(faerdig).length} af ${D.numre.length} færdige`;
  const n = D.numre[aktiv], s = D.svar[n.id] || {};
  document.getElementById("main").innerHTML = `
    <p class="intro">Tryk afspil: du hører nummeret med <b>klik på de taktslag, motoren har fundet</b> (høje klik = 1'eren i takten).
      De <b style="color:var(--accent)">gule streger</b> er de steder, hvor motoren mener, nummeret skifter del. Svar ud fra dine ører
      – gerne med høretelefoner.</p>
    <div class="kort">
      <div class="titel">${esc(n.titel)}</div><div class="info">${esc(n.kunstner)} · ${tid(n.varighed)}</div>
      <div class="fakta"><span>Motorens tempo: <b>${n.tempo ? Math.round(n.tempo) + " BPM" : "ingen fast puls"}</b></span>
        <span>Takt: <b>${n.takt ? n.takt + "/4" : "–"}</b></span><span>Intro: <b>${n.intro} s</b></span></div>
      <canvas id="boelge"></canvas>
      <div class="forklaring"><span><i style="background:var(--tekst)"></i>taktslag</span><span><i style="background:#fff;height:14px"></i>1'er</span>
        <span><i style="background:var(--accent)"></i>skift (sektion)</span><span>Tryk i bølgen for at springe</span></div>
      <div class="styring"><button class="knap primaer" id="afspil">▶ Afspil med klik</button>
        <button class="knap" id="slut">Hør slutningen</button>
        <label><input type="checkbox" id="klik" ${klik ? "checked" : ""}> Klik</label>
        <span class="svag" id="tid"></span></div>
      <div class="spoerg">${spoergsmaal(n).map(([k, tekst, valg, hjaelp]) => `<div class="linje"><div>${tekst}</div><div><div class="valg">${valg.map(([v, o]) =>
        `<button data-k="${k}" data-v="${v}" class="${s[k] === v ? "valgt" : ""}">${o}</button>`).join("")}</div>${hjaelp
        ? `<div class="svag" style="font-size:13px;margin-top:6px">${hjaelp}</div>` : ""}</div></div>`).join("")}
        <textarea id="kommentar" placeholder="Kommentar (valgfrit)">${esc(s.kommentar || "")}</textarea>
        <div class="styring"><button class="knap primaer" id="naeste">${aktiv + 1 < D.numre.length ? "Næste nummer →" : "Færdig"}</button></div>
      </div>
    </div>`;
  document.getElementById("afspil").onclick = () => spiller ? stop() : afspil(offset);
  document.getElementById("slut").onclick = () => afspil(Math.max(0, n.varighed - 20));
  document.getElementById("klik").onchange = e => { klik = e.target.checked; if (spiller) afspil(nu()); };
  document.querySelectorAll(".valg button").forEach(b => b.onclick = () => {
    const s = D.svar[n.id] ||= {};
    s[b.dataset.k] = b.dataset.v;
    s.tid = new Date().toISOString().slice(0, 19);
    gem(n); tegnKnapper();
  });
  document.getElementById("kommentar").onchange = () => gem(n);
  document.getElementById("naeste").onclick = () => {
    gem(n);
    const f = D.numre.findIndex(x => !faerdig(x));
    if (aktiv + 1 < D.numre.length) { aktiv++; offset = 0; tegn(); }
    else if (f < 0) tak();
    else { aktiv = f; tegn(); }  // sidste nummer, men nogle mangler svar: hop til det første
    scrollTo(0, 0);
  };
  const c = document.getElementById("boelge");
  c.onclick = e => { const r = c.getBoundingClientRect(); afspil(n.varighed * (e.clientX - r.left) / r.width); };
  offset = 0;
  hentBoelge(n.id).then(() => tegnBoelge());
}
function tegnKnapper() {
  const s = D.svar[D.numre[aktiv].id] || {};
  document.querySelectorAll(".valg button").forEach(b => b.classList.toggle("valgt", s[b.dataset.k] === b.dataset.v));
  document.getElementById("status").textContent = `${D.numre.filter(faerdig).length} af ${D.numre.length} færdige`;
}
async function gem(n) {
  const s = D.svar[n.id] || {};
  s.kommentar = document.getElementById("kommentar")?.value.trim() || s.kommentar || "";
  D.svar[n.id] = s;
  if (!WEB) return fetch("/api/svar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id: n.id, ...s})});
  husk(N("svar:" + navn), D.svar);  // alle svar sendes hver gang – så kommer et tabt svar med næste gang
  sendAlt();
}

// ---- Afspilning i samme lydmotor som klikkene, så de ligger præcist på slaget ----
async function buffer(n) {
  if (!buffere[n.id]) {
    document.getElementById("tid").textContent = "henter lyd …";
    const b = await (await fetch(n.lyd)).arrayBuffer();
    // Kun ét nummer ad gangen i hukommelsen (et udpakket nummer fylder ca. 90 MB – for meget for en telefon ×12)
    for (const k in buffere) delete buffere[k];
    buffere[n.id] = await ctx.decodeAudioData(b);
    document.getElementById("tid").textContent = "";
  }
  return buffere[n.id];
}
function nu() { return spiller ? ctx.currentTime - t0 : offset; }
async function afspil(fra) {
  // iPhone: spil også med lydløs-knappen slået til, og start lydmotoren i selve trykket
  if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch (e) {}
  ctx ||= new AudioContext();
  if (ctx.state === "suspended") ctx.resume();
  const n = D.numre[aktiv], buf = await buffer(n);
  stop(false);
  kilde = ctx.createBufferSource(); kilde.buffer = buf; kilde.connect(ctx.destination);
  const start = ctx.currentTime + .08;
  kilde.start(start, fra); t0 = start - fra; spiller = true; planlagt = new Set();
  document.getElementById("afspil").textContent = "❚❚ Pause";
}
function stop(husk = true) {
  if (kilde) { try { kilde.stop(); } catch (e) {} kilde = null; }
  if (husk && spiller) offset = ctx.currentTime - t0;
  spiller = false;
  const b = document.getElementById("afspil"); if (b) b.textContent = "▶ Afspil med klik";
}
function klikLyd(naar, et) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = et ? 1760 : 1100;
  g.gain.setValueAtTime(et ? .5 : .28, naar); g.gain.exponentialRampToValueAtTime(.001, naar + .05);
  o.connect(g); g.connect(ctx.destination); o.start(naar); o.stop(naar + .06);
}
setInterval(() => {  // planlæg klik for de næste 0,4 s
  if (!spiller || !klik || !D) return;
  const n = D.numre[aktiv], p = nu(), et = new Set(n.downbeats.map(x => x.toFixed(2)));
  for (const b of n.beats) if (b >= p && b < p + .4 && !planlagt.has(b)) { planlagt.add(b); klikLyd(t0 + b, et.has(b.toFixed(2))); }
}, 50);
(function loekke() {
  if (D && document.getElementById("boelge")) {
    tegnBoelge();
    const t = document.getElementById("tid");
    if (t && spiller) t.textContent = tid(nu());
  }
  requestAnimationFrame(loekke);
})();

// ---- Bølge med taktslag og skift ----
function hentBoelge(id) {
  return boelger[id] ||= WEB ? Promise.resolve(WEB.boelger[id] || null)
    : fetch(`/api/boelge/${id}`).then(r => r.ok ? r.json() : null).catch(() => null);
}
async function tegnBoelge() {
  const c = document.getElementById("boelge"); if (!c) return;
  const n = D.numre[aktiv], b = await boelger[n.id];
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const V = n.varighed, x = t => w * t / V, mid = h * .42;
  if (b?.streger) {
    const antal = Math.floor(w / 3);
    for (let k = 0; k < antal; k++) {
      const v = b.streger[Math.floor(k * b.streger.length / antal)] || 0, hh = Math.max(1, v * h * .7);
      g.fillStyle = k / antal <= nu() / V ? "#a8875a" : "rgba(201,196,187,.35)"; g.fillRect(k * 3, mid - hh / 2, 2, hh);
    }
  }
  const et = new Set(n.downbeats.map(t => t.toFixed(2)));
  for (const t of n.beats) { const d = et.has(t.toFixed(2)); g.fillStyle = d ? "#fff" : "rgba(201,196,187,.55)"; g.fillRect(x(t), h - (d ? 18 : 9), 1, d ? 18 : 9); }
  g.fillStyle = "#c9a15f";
  for (const t of n.sektioner || []) if (t > 0) g.fillRect(x(t) - 1, 0, 2, h - 20);
  g.fillStyle = "#fff"; g.fillRect(x(nu()) - 1, 0, 2, h);
}
hent();
</script>
