];

function somKarakterer() {

async function hent() {
  if (WEB) {

        D.svar[id] = {...s, ...Object.fromEntries(Object.entries(D.svar[id] || {}).filter(([, v]) => v))};

    if (Object.keys(D.svar).length) sendAlt();  // svar, der ikke nåede frem sidst (fx kommentarer før oerer.php fandtes)
  } else D = await (await fetch("/api/numre")).json();
  const f = D.numre.findIndex(n => !faerdig(n));
  aktiv = f < 0 ? 0 : f;
  tegn();

        <span><i style="background:var(--accent)"></i>skift (sektion)</span><span>Tryk i bølgen for at springe</span></div>
      <div class="styring"><button class="knap primaer" id="afspil">▶ Afspil med klik</button>
        <button class="knap" id="slut">Hør slutningen</button>
        <label><input type="checkbox" id="klik" ${klik ? "checked" : ""}> Klik</label>
        <span class="svag" id="tid"></span></div>
      <div class="spoerg">${SPG.map(([k, tekst, valg, hjaelp]) => `<div class="linje"><div>${tekst}</div><div><div class="valg">${valg.map(([v, o]) =>
        `<button data-k="${k}" data-v="${v}" class="${s[k] === v ? "valgt" : ""}">${o}</button>`).join("")}</div>${hjaelp
        ? `<div class="svag" style="font-size:13px;margin-top:6px">${hjaelp}</div>` : ""}</div></div>`).join("")}
        <textarea id="kommentar" placeholder="Kommentar (valgfrit)">${esc(s.kommentar || "")}</textarea>
        <div class="styring"><button class="knap primaer" id="naeste">${aktiv + 1 < D.numre.length ? "Næste nummer →" : "Færdig"}</button></div>
      </div>
    </div>`;
  document.getElementById("afspil").onclick = () => spiller ? stop() : afspil(offset);
  document.getElementById("slut").onclick = () => afspil(Math.max(0, n.varighed - 20));
  document.getElementById("klik").onchange = e => { klik = e.target.checked; if (spiller) afspil(nu()); };
  document.querySelectorAll(".valg button").forEach(b => b.onclick = () => {
    const s = D.svar[n.id] ||= {};
    s[b.dataset.k] = b.dataset.v;
    s.tid = new Date().toISOString().slice(0, 19);
    gem(n); tegnKnapper();
  });
  document.getElementById("kommentar").onchange = () => gem(n);
  document.getElementById("naeste").onclick = () => {
    gem(n);
    const f = D.numre.findIndex(x => !faerdig(x));
    if (aktiv + 1 < D.numre.length) { aktiv++; offset = 0; tegn(); }
    else if (f < 0) tak();
    else { aktiv = f; tegn(); }  // sidste nummer, men nogle mangler svar: hop til det første
    scrollTo(0, 0);
  };
  const c = document.getElementById("boelge");
  c.onclick = e => { const r = c.getBoundingClientRect(); afspil(n.varighed * (e.clientX - r.left) / r.width); };
  offset = 0;
  hentBoelge(n.id).then(() => tegnBoelge());
}
function tegnKnapper() {
  const s = D.svar[D.numre[aktiv].id] || {};
  document.querySelectorAll(".valg button").forEach(b => b.classList.toggle("valgt", s[b.dataset.k] === b.dataset.v));
  document.getElementById("status").textContent = `${D.numre.filter(faerdig).length} af ${D.numre.length} færdige`;
}
async function gem(n) {
  const s = D.svar[n.id] || {};
  s.kommentar = document.getElementById("kommentar")?.value.trim() || s.kommentar || "";
  D.svar[n.id] = s;
  if (!WEB) return fetch("/api/svar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id: n.id, ...s})});
  husk(N("svar:" + navn), D.svar);  // alle svar sendes hver gang – så kommer et tabt svar med næste gang
  sendAlt();
}

// ---- Afspilning i samme lydmotor som klikkene, så de ligger præcist på slaget ----
async function buffer(n) {
  if (!buffere[n.id]) {
    document.getElementById("tid").textContent = "henter lyd …";
    const b = await (await fetch(n.lyd)).arrayBuffer();
    // Kun ét nummer ad gangen i hukommelsen (et udpakket nummer fylder ca. 90 MB – for meget for en telefon ×12)
    for (const k in buffere) delete buffere[k];
    buffere[n.id] = await ctx.decodeAudioData(b);
    document.getElementById("tid").textContent = "";
  }
  return buffere[n.id];
}
function nu() { return spiller ? ctx.currentTime - t0 : offset; }
async function afspil(fra) {
  // iPhone: spil også med lydløs-knappen slået til, og start lydmotoren i selve trykket
  if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch (e) {}
  ctx ||= new AudioContext();
  if (ctx.state === "suspended") ctx.resume();
  const n = D.numre[aktiv], buf = await buffer(n);
  stop(false);
  kilde = ctx.createBufferSource(); kilde.buffer = buf; kilde.connect(ctx.destination);
  const start = ctx.currentTime + .08;
  kilde.start(start, fra); t0 = start - fra; spiller = true; planlagt = new Set();
  document.getElementById("afspil").textContent = "❚❚ Pause";
}
function stop(husk = true) {
  if (kilde) { try { kilde.stop(); } catch (e) {} kilde = null; }
  if (husk && spiller) offset = ctx.currentTime - t0;
  spiller = false;
  const b = document.getElementById("afspil"); if (b) b.textContent = "▶ Afspil med klik";
}
function klikLyd(naar, et) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = et ? 1760 : 1100;
  g.gain.setValueAtTime(et ? .5 : .28, naar); g.gain.exponentialRampToValueAtTime(.001, naar + .05);
  o.connect(g); g.connect(ctx.destination); o.start(naar); o.stop(naar + .06);
}
setInterval(() => {  // planlæg klik for de næste 0,4 s
  if (!spiller || !klik || !D) return;
  const n = D.numre[aktiv], p = nu(), et = new Set(n.downbeats.map(x => x.toFixed(2)));
  for (const b of n.beats) if (b >= p && b < p + .4 && !planlagt.has(b)) { planlagt.add(b); klikLyd(t0 + b, et.has(b.toFixed(2))); }
}, 50);
(function loekke() {
  if (D && document.getElementById("boelge")) {
    tegnBoelge();
    const t = document.getElementById("tid");
    if (t && spiller) t.textContent = tid(nu());
  }
  requestAnimationFrame(loekke);
})();

// ---- Bølge med taktslag og skift ----
function hentBoelge(id) {
  return boelger[id] ||= WEB ? Promise.resolve(WEB.boelger[id] || null)
    : fetch(`/api/boelge/${id}`).then(r => r.ok ? r.json() : null).catch(() => null);
}
async function tegnBoelge() {
  const c = document.getElementById("boelge"); if (!c) return;
  const n = D.numre[aktiv], b = await boelger[n.id];
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const V = n.varighed, x = t => w * t / V, mid = h * .42;
  if (b?.streger) {
    const antal = Math.floor(w / 3);
    for (let k = 0; k < antal; k++) {
      const v = b.streger[Math.floor(k * b.streger.length / antal)] || 0, hh = Math.max(1, v * h * .7);
      g.fillStyle = k / antal <= nu() / V ? "#a8875a" : "rgba(201,196,187,.35)"; g.fillRect(k * 3, mid - hh / 2, 2, hh);
    }
  }
  const et = new Set(n.downbeats.map(t => t.toFixed(2)));
  for (const t of n.beats) { const d = et.has(t.toFixed(2)); g.fillStyle = d ? "#fff" : "rgba(201,196,187,.55)"; g.fillRect(x(t), h - (d ? 18 : 9), 1, d ? 18 : 9); }
  g.fillStyle = "#c9a15f";
  for (const t of n.sektioner || []) if (t > 0) g.fillRect(x(t) - 1, 0, 2, h - 20);
  g.fillStyle = "#fff"; g.fillRect(x(nu()) - 1, 0, 2, h);
}
hent();
</script>
